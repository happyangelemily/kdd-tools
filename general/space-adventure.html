<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空冒险 v3 — 星际往返</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:'Microsoft YaHei',sans-serif; }
  canvas { display:block; margin:0 auto; }
</style>
</head>
<body>
<script>
// ═══════════════════════════════════════════
//  太空冒险 v3 — 星际往返
//  地球↔家园星球往返贸易 + 同伴 + 飞船升级
// ═══════════════════════════════════════════

const CONFIG = {
  worldW:5000, worldH:4000,
  homeWorldW:3000, homeWorldH:2500,
  canvasW:960, canvasH:600,
  homeDistance:57000,
  meteorInterval:130, treasureInterval:220, enemySpawnInterval:240,
  spaceFlightDuration:1800, spaceSpeed:5,
};

const PAL = {
  ground1:'#4a7c3f', ground2:'#3d6b34', ground3:'#5c8a4a',
  alienGreen:'#5ce65c', alienDark:'#3a9e3a',
  eyeWhite:'#ffffff', eyePupil:'#111111',
  gold:'#ffd700', goldLight:'#fff3b0',
  fragment:'#64d8ff', fragGlow:'#b3eeff',
  meteor:'#8b7355', meteorHot:'#ff6b35',
  enemyRed:'#cc4444', enemyOrange:'#ee8833', enemyPurple:'#9944cc',
  uiBg:'rgba(0,0,20,0.85)',
  uiGold:'#ffd700', uiText:'#e0e0e0', uiAccent:'#5ce65c', danger:'#ff4444',
  homePlanet:'#f8f8ff', sun:'#ffdd44',
  shopBg:'rgba(5,5,30,0.95)',
  armorBlue:'#4499ff', speedYellow:'#ffcc44',
  landingGreen:'#aaffaa', saveGreen:'#00ff88',
  homeGround:'#e8e8f0', homeBuilding:'#d0d0e0',
  companionPink:'#ff88cc', companionCyan:'#44dddd',
};

// ═══════════ 全局状态 ═══════════
let gameState='earth'; // earth | launching | spaceToHome | landingHome | home | spaceToEarth | landingEarth | win
let alien, camera, items=[], meteorites=[], enemies=[], particles=[];
let stars=[], terrainMap=[], homeTerrain=[], spaceRocks=[];
let shopOpen=false, shopTab='weapon';
let shakeAmount=0;
let saveNotice=0;
let achievementText='', achievementTimer=0;
let frameCountSinceSave=0;
let titleScreen=true;

// 太空飞行
let spaceProgress=0, shipX, shipY, shipVX=0, shipVY=0;
let shipFuel=100, shipMaxFuel=100;

// 着陆
let landingPhase=0, landingTimer=0;
let launchTimer=0;

// 飞船属性
let shipCargo=0, shipMaxCargo=10;
let shipSpeed=1.0; // 速度倍率
let shipLevel=0; // 0=基础 1=升级 2=高级 3=终极

// 家园星球存储
let homeStorage=0; // 存放在家园的宝物数量

// 同伴
let companions=[];
let companionSlots=0; // 解锁的同伴槽位

// 货物追踪
let carriedTreasures=0; // 当前身上带的宝物(地球收集待运输)

// ═══════════ 物品类 ═══════════
class Item {
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type; this.collected=false;
    this.size=type==='fragment'?14:12;
    this.bobPhase=random(TWO_PI); this.glowPhase=random(TWO_PI);
    this.value=type==='treasure'?floor(random(3,16)):1; // 降低了宝物价值
  }
  update(){this.bobPhase+=0.03; this.glowPhase+=0.05;}
  draw(cam){
    let sx=this.x-cam.x+width/2, sy=this.y-cam.y+height/2;
    if(sx<-40||sx>width+40||sy<-40||sy>height+40)return;
    let bob=sin(this.bobPhase)*3;
    if(this.type==='treasure'){
      drawingContext.shadowBlur=12; drawingContext.shadowColor=PAL.gold;
      fill(PAL.goldLight); noStroke(); ellipse(sx,sy+bob,this.size*1.4,this.size*1.4);
      drawingContext.shadowBlur=0;
      fill(PAL.gold); beginShape();
      vertex(sx,sy+bob-this.size); vertex(sx+this.size*0.6,sy+bob);
      vertex(sx,sy+bob+this.size); vertex(sx-this.size*0.6,sy+bob);
      endShape(CLOSE);
      fill(255,255,255,180); ellipse(sx,sy+bob-2,3,3);
      fill(255,255,255,200); textSize(9); textAlign(CENTER); text('$'+this.value,sx,sy+bob-this.size-6);
    }else{
      drawingContext.shadowBlur=16; drawingContext.shadowColor=PAL.fragment;
      fill(PAL.fragGlow); noStroke(); ellipse(sx,sy+bob,this.size*1.5,this.size*1.5);
      drawingContext.shadowBlur=0;
      fill(PAL.fragment); let segs=6; beginShape();
      for(let i=0;i<segs*2;i++){let a=i*PI/segs-PI/2; let r=i%2===0?this.size:this.size*0.5; vertex(sx+cos(a)*r,sy+bob+sin(a)*r);}
      endShape(CLOSE);
      fill(255,255,255,200); ellipse(sx,sy+bob-1,4,4);
    }
  }
}

// ═══════════ 陨石 ═══════════
class Meteorite {
  constructor(x,y){
    this.x=x; this.y=y; this.targetY=y+random(40,120); this.landed=false; this.landY=this.targetY;
    this.fallSpeed=random(1.5,3.5); this.size=random(10,22);
    this.rotation=random(TWO_PI); this.rotSpeed=random(-0.05,0.05); this.eaten=false; this.glowTimer=0;
  }
  update(){
    if(!this.landed){this.y+=this.fallSpeed; this.rotation+=this.rotSpeed;
      if(this.y>=this.landY){this.landed=true; this.y=this.landY; this.glowTimer=60;}
      if(frameCount%2===0)particles.push(new Particle(this.x+random(-5,5),this.y-8,PAL.meteorHot,2));
    }if(this.glowTimer>0)this.glowTimer--;
  }
  draw(cam){
    let sx=this.x-cam.x+width/2, sy=this.y-cam.y+height/2;
    if(sx<-40||sx>width+40||sy<-40||sy>height+40)return;
    push(); translate(sx,sy); rotate(this.rotation);
    if(!this.landed||this.glowTimer>0){drawingContext.shadowBlur=18; drawingContext.shadowColor=this.landed?PAL.meteor:PAL.meteorHot;}
    fill(this.landed?PAL.meteor:lerpColor(color(PAL.meteorHot),color(PAL.meteor),0.6)); noStroke(); beginShape();
    for(let i=0;i<8;i++){let a=i*TWO_PI/8; let r=this.size*(0.7+noise(i*0.7,frameCount*0.02)*0.3); vertex(cos(a)*r,sin(a)*r);}
    endShape(CLOSE);
    fill(0,0,0,60); ellipse(-2,-2,this.size*0.4,this.size*0.3); ellipse(3,2,this.size*0.25,this.size*0.2);
    drawingContext.shadowBlur=0; pop();
  }
}

// ═══════════ 敌人 ═══════════
class Enemy {
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type||'critter'; this.alive=true; this.damageFlash=0; this.attackCooldown=0;
    switch(this.type){
      case 'critter': this.hp=10; this.maxHp=10; this.speed=random(0.7,1.5); this.size=14; this.damage=5; this.aggroRange=110; this.color=PAL.enemyRed; this.dropRate=0.2; break;
      case 'beast': this.hp=30; this.maxHp=30; this.speed=random(0.4,1.0); this.size=22; this.damage=12; this.aggroRange=160; this.color=PAL.enemyOrange; this.dropRate=0.4; break;
      case 'guardian': this.hp=60; this.maxHp=60; this.speed=random(0.2,0.5); this.size=28; this.damage=22; this.aggroRange=200; this.color=PAL.enemyPurple; this.dropRate=0.7; break;
    }
    this.wanderAngle=random(TWO_PI); this.wanderTimer=0;
  }
  update(){
    if(!this.alive)return;
    if(this.damageFlash>0)this.damageFlash--; if(this.attackCooldown>0)this.attackCooldown--;
    let dx=alien.x-this.x, dy=alien.y-this.y, distSq=dx*dx+dy*dy;
    if(distSq<this.aggroRange*this.aggroRange){
      let a=atan2(dy,dx); this.x+=cos(a)*this.speed*1.5; this.y+=sin(a)*this.speed*1.5;
      if(distSq<50*50&&this.attackCooldown<=0){
        alien.takeDamage(this.damage);
        this.attackCooldown=this.type==='guardian'?40:70;
        shakeAmount=max(shakeAmount,this.type==='guardian'?14:8);
      }
    }else{
      this.wanderTimer--; if(this.wanderTimer<=0){this.wanderAngle=random(TWO_PI); this.wanderTimer=floor(random(60,180));}
      this.x+=cos(this.wanderAngle)*this.speed; this.y+=sin(this.wanderAngle)*this.speed;
    }
    this.x=constrain(this.x,40,CONFIG.worldW-40); this.y=constrain(this.y,40,CONFIG.worldH-40);
  }
  takeDamage(dmg){
    this.hp-=dmg; this.damageFlash=8;
    if(this.hp<=0){this.alive=false;
      for(let i=0;i<14;i++)particles.push(new Particle(this.x,this.y,this.color,3));
      if(random()<this.dropRate){items.push(new Item(this.x,this.y,'fragment'));}
      else{items.push(new Item(this.x,this.y,'treasure'));}
      if(this.type==='guardian'){items.push(new Item(this.x+random(-20,20),this.y+random(-20,20),'treasure')); items.push(new Item(this.x+random(-20,20),this.y+random(-20,20),'fragment')); showAchievement('击败守护者！');}}
  }
  draw(cam){
    if(!this.alive)return;
    let sx=this.x-cam.x+width/2, sy=this.y-cam.y+height/2;
    if(sx<-60||sx>width+60||sy<-60||sy>height+60)return;
    push(); translate(sx,sy+sin(frameCount*0.06+this.x*0.01)*2);
    fill(this.damageFlash>0?'#ffffff':this.color); stroke(lerpColor(color(this.color),color(0,0,0),0.5)); strokeWeight(2.5);
    if(this.type==='guardian'){beginShape(); for(let i=0;i<10;i++){let a=i*TWO_PI/10-PI/2; let r=i%2===0?this.size*1.1:this.size*0.7; vertex(cos(a)*r,sin(a)*r);} endShape(CLOSE); fill(255,255,255,100); ellipse(0,-this.size*0.2,this.size*0.5,this.size*0.4);}
    else{ellipse(0,0,this.size*2,this.size*1.6);}
    fill(255); noStroke(); let es=this.type==='guardian'?10:8;
    ellipse(-5,-3,es,es); ellipse(5,-3,es,es); fill(0);
    let ex=constrain(alien.x-this.x,-3,3), ey=constrain(alien.y-this.y,-3,3);
    ellipse(-5+ex*0.3,-3+ey*0.3,4,4); ellipse(5+ex*0.3,-3+ey*0.3,4,4);
    stroke(0); strokeWeight(1.5); noFill(); arc(0,2,8,5,0,PI);
    if(this.hp<this.maxHp){noStroke(); fill(0,0,0,150); rect(-this.size,-this.size-8,this.size*2,4,2); fill(lerpColor(color(PAL.danger),color(PAL.uiAccent),this.hp/this.maxHp)); rect(-this.size,-this.size-8,this.size*2*(this.hp/this.maxHp),4,2);}
    if(this.type==='guardian'){fill(this.color); textSize(10); textAlign(CENTER); text('守护者',0,-this.size-14);}
    pop();
  }
}

// ═══════════ 同伴类 ═══════════
class Companion {
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type||'scout'; this.alive=true;
    switch(type){
      case 'scout': this.hp=40; this.maxHp=40; this.damage=5; this.speed=3.0; this.size=12; this.color=PAL.companionPink; this.cargoBonus=2; this.cost=60; this.name='侦察兵'; break;
      case 'fighter': this.hp=70; this.maxHp=70; this.damage=15; this.speed=2.2; this.size=16; this.color=PAL.companionCyan; this.cargoBonus=3; this.cost=120; this.name='战士'; break;
    }
    this.attackCooldown=0; this.targetEnemy=null;
  }
  update(){
    if(!this.alive)return;
    if(this.attackCooldown>0)this.attackCooldown--;
    // 跟随外星人
    let dx=alien.x-this.x, dy=alien.y-this.y, d=sqrt(dx*dx+dy*dy);
    if(d>50){this.x+=(dx/d)*this.speed; this.y+=(dy/d)*this.speed;}
    else if(d>25){this.x+=dx*0.02; this.y+=dy*0.02;}
    // 找最近的敌人攻击
    if(this.attackCooldown<=0){
      let closest=null, closestDist=200;
      for(let e of enemies){if(!e.alive)continue; let ed=dist(this.x,this.y,e.x,e.y); if(ed<closestDist){closestDist=ed; closest=e;}}
      if(closest){closest.takeDamage(this.damage); this.attackCooldown=50; particles.push(new Particle(closest.x,closest.y,this.color,3));}
    }
  }
  takeDamage(dmg){this.hp-=dmg; if(this.hp<=0){this.hp=0; this.alive=false;}}
  draw(cam){
    if(!this.alive)return;
    let sx=this.x-cam.x+width/2, sy=this.y-cam.y+height/2;
    if(sx<-40||sx>width+40||sy<-40||sy>height+40)return;
    fill(this.color); noStroke(); ellipse(sx,sy,this.size*1.5,this.size*1.5);
    fill(255); ellipse(sx-3,sy-3,6,6); ellipse(sx+3,sy-3,6,6); fill(0); ellipse(sx-3,sy-3,3,3); ellipse(sx+3,sy-3,3,3);
    if(this.hp<this.maxHp){noStroke(); fill(0,0,0,150); rect(sx-10,sy-14,20,3,1); fill(PAL.uiAccent); rect(sx-10,sy-14,20*(this.hp/this.maxHp),3,1);}
  }
}

// ═══════════ 粒子 ═══════════
class Particle {
  constructor(x,y,col,sz){this.x=x; this.y=y; this.vx=random(-2,2); this.vy=random(-2,2); this.col=col; this.size=sz||random(1,4); this.life=30; this.maxLife=30;}
  update(){this.x+=this.vx; this.y+=this.vy; this.vy+=0.05; this.life--;}
  draw(cam){let sx=this.x-cam.x+width/2, sy=this.y-cam.y+height/2; let a=map(this.life,0,this.maxLife,0,255); fill(red(this.col),green(this.col),blue(this.col),a); noStroke(); ellipse(sx,sy,this.size,this.size);}
  get dead(){return this.life<=0;}
}

// ═══════════ 外星人类 ═══════════
class Alien {
  constructor(){this.reset();}
  reset(){
    this.x=CONFIG.worldW/2; this.y=CONFIG.worldH/2; this.baseSpeed=2.5; this.size=18;
    this.hp=100; this.maxHp=100; this.money=0; this.fragments=0;
    this.weaponLevel=0; this.armorLevel=0; this.speedLevel=0;
    this.weaponNames=['小刀','大刀','巨型刀','超级大砍刀'];
    this.weaponDamages=[3,10,30,50]; this.weaponSizes=[20,30,42,55];
    this.armorNames=['无护甲','轻甲','重甲','能量盾']; this.armorReductions=[0,0.2,0.4,0.6];
    this.speedNames=['普通','加速靴','高速靴','超音速靴']; this.speedBoosts=[1,1.4,1.8,2.5];
    this.hasSpaceship=false; this.facing=1; this.attackTimer=0; this.invincibleTimer=0; this.walkCycle=0;
    this.carriedTreasures=0; this.carriedFragments=0;
  }
  get weaponName(){return this.weaponNames[this.weaponLevel];}
  get weaponDamage(){return this.weaponDamages[this.weaponLevel];}
  get weaponSize(){return this.weaponSizes[this.weaponLevel];}
  get armorName(){return this.armorNames[this.armorLevel];}
  get armorReduction(){return this.armorReductions[this.armorLevel];}
  get speedName(){return this.speedNames[this.speedLevel];}
  get speed(){return this.baseSpeed*this.speedBoosts[this.speedLevel];}
  get totalCargo(){let c=shipMaxCargo; for(let comp of companions){if(comp.alive)c+=comp.cargoBonus;} return c;}
  get currentCargo(){return this.carriedTreasures;}

  update(){
    if(this.attackTimer>0)this.attackTimer--; if(this.invincibleTimer>0)this.invincibleTimer--;
    let mx=0,my=0;
    if(keyIsDown(LEFT_ARROW)||keyIsDown(65))mx=-1; if(keyIsDown(RIGHT_ARROW)||keyIsDown(68))mx=1;
    if(keyIsDown(UP_ARROW)||keyIsDown(87))my=-1; if(keyIsDown(DOWN_ARROW)||keyIsDown(83))my=1;
    if(mx!==0&&my!==0){mx*=0.707;my*=0.707;} if(mx!==0)this.facing=mx;
    this.x+=mx*this.speed; this.y+=my*this.speed; this.walkCycle+=sqrt(mx*mx+my*my)*0.3;
    this.x=constrain(this.x,20,CONFIG.worldW-20); this.y=constrain(this.y,20,CONFIG.worldH-20);
    for(let item of items){
      if(item.collected)continue;
      if(dist(this.x,this.y,item.x,item.y)<30){
        item.collected=true;
        if(item.type==='treasure'){
          if(this.currentCargo<this.totalCargo){this.carriedTreasures++; this.money+=item.value;
            for(let i=0;i<10;i++)particles.push(new Particle(item.x,item.y,PAL.gold,3));}
          else{showAchievement('⚠ 货舱已满！运送宝物回家或升级飞船'); item.collected=false;}
        }else{this.fragments++; for(let i=0;i<12;i++)particles.push(new Particle(item.x,item.y,PAL.fragment,3));
          if(this.fragments>=20&&!this.hasSpaceship){this.hasSpaceship=true; for(let i=0;i<50;i++){particles.push(new Particle(this.x,this.y,PAL.gold,5)); particles.push(new Particle(this.x,this.y,PAL.fragment,5));} showAchievement('🚀 飞船零件集齐！');}}
      }
    }
    for(let met of meteorites){if(met.eaten||!met.landed)continue; if(dist(this.x,this.y,met.x,met.y)<30){met.eaten=true; this.hp=min(this.maxHp,this.hp+12); for(let i=0;i<10;i++)particles.push(new Particle(met.x,met.y,'#ffcc88',4));}}
  }
  attack(){
    if(this.attackTimer>0)return; this.attackTimer=15;
    let ax=this.x+this.facing*45, ay=this.y;
    for(let i=0;i<8;i++)particles.push(new Particle(ax+random(-10,10),ay+random(-10,10),'#ffffff',3));
    for(let enemy of enemies){if(!enemy.alive)continue; if(dist(ax,ay,enemy.x,enemy.y)<55){enemy.takeDamage(this.weaponDamage); shakeAmount=max(shakeAmount,3);}}
  }
  takeDamage(dmg){
    if(this.invincibleTimer>0)return; dmg=floor(dmg*(1-this.armorReduction)); if(dmg<1)dmg=1;
    this.hp-=dmg; this.invincibleTimer=30; shakeAmount=max(shakeAmount,5);
    if(this.hp<=0){this.hp=0; resetGame();}
  }
  draw(cam){
    let sx=this.x-cam.x+width/2, sy=this.y-cam.y+height/2;
    push(); translate(sx,sy);
    if(this.invincibleTimer>0&&floor(this.invincibleTimer/4)%2===0)tint(255,128);
    noStroke(); fill(0,0,0,50); ellipse(0,2,this.size*2,this.size*0.6);
    fill(PAL.alienGreen); stroke(PAL.alienDark); strokeWeight(2); ellipse(0,-2,this.size*1.6,this.size*1.5);
    fill(PAL.alienDark); noStroke(); ellipse(0,2,this.size*0.9,this.size*0.7);
    if(this.armorLevel>0){noFill(); let ac=[PAL.armorBlue,'#88ccff','#aaddff'][this.armorLevel-1]; stroke(ac); strokeWeight(2+this.armorLevel); ellipse(0,-2,this.size*1.6+4,this.size*1.5+4); if(this.armorLevel===3){drawingContext.shadowBlur=10; drawingContext.shadowColor=ac; ellipse(0,-2,this.size*1.6+4,this.size*1.5+4); drawingContext.shadowBlur=0;}}
    stroke(PAL.alienGreen); strokeWeight(3); noFill(); line(-6,-14,-7,-20); line(6,-14,7,-20);
    noStroke(); fill(PAL.eyeWhite); ellipse(-7,-21,10,11); ellipse(7,-21,10,11);
    fill(PAL.eyePupil); ellipse(-7+this.facing*1.5,-21,5,6); ellipse(7+this.facing*1.5,-21,5,6);
    stroke(PAL.alienDark); strokeWeight(1.5); noFill(); arc(0,-6,10,6,0.1,PI-0.1);
    stroke(PAL.alienGreen); strokeWeight(2); noFill(); let ap=sin(this.walkCycle*2)*3; beginShape(); vertex(0,-14); vertex(-4+ap*0.3,-24); endShape();
    fill(PAL.alienDark); noStroke(); ellipse(-4,-25,5,5);
    fill(PAL.alienGreen); noStroke(); let wb=sin(this.walkCycle)*3; ellipse(-6,10+wb*0.5,8,5); ellipse(6,10-wb*0.5,8,5);
    if(this.speedLevel>0){let sc=[PAL.speedYellow,'#ffaa00','#ff6600'][this.speedLevel-1]; fill(sc); ellipse(-6,12,10,7); ellipse(6,12,10,7);}
    this.drawWeapon(); pop();
  }
  drawWeapon(){
    push(); translate(this.facing*12,-5); rotate(this.facing*(this.attackTimer>0?-PI/3*(this.attackTimer/15):PI/6));
    let ws=this.weaponSize, wc=this.weaponLevel===3?'#e0e0ff':(this.weaponLevel>=2?'#c0c0c0':'#999999');
    fill(wc); stroke('#555555'); strokeWeight(2); beginShape(); vertex(0,-3); vertex(this.facing*ws,-6); vertex(this.facing*ws,0); vertex(this.facing*ws,6); vertex(0,3); endShape(CLOSE);
    fill('#8B4513'); noStroke(); rect(-6,-2.5,6,5,2);
    if(this.weaponLevel>=3){drawingContext.shadowBlur=10; drawingContext.shadowColor='#aaccff'; stroke('#aaccff'); strokeWeight(1.5); noFill(); line(this.facing*ws*0.6,-4,this.facing*ws,0); drawingContext.shadowBlur=0;}
    pop();
  }
}

// ═══════════ 成就 ═══════════
function showAchievement(msg){achievementText=msg; achievementTimer=180;}
function drawAchievement(){
  if(achievementTimer<=0)return; achievementTimer--;
  let alpha=achievementTimer<30?map(achievementTimer,0,30,0,255):255;
  let slide=achievementTimer<30?map(achievementTimer,0,30,0,20):0;

const SAVE_KEY='space_adventure_save_v3';
function saveGame(){
  let data={
    alien:{x:alien.x,y:alien.y,hp:alien.hp,maxHp:alien.maxHp,money:alien.money,fragments:alien.fragments,weaponLevel:alien.weaponLevel,armorLevel:alien.armorLevel,speedLevel:alien.speedLevel,hasSpaceship:alien.hasSpaceship,carriedTreasures:alien.carriedTreasures},
    gameState, spaceProgress, shipCargo, shipMaxCargo, shipLevel, shipSpeed, homeStorage, companionSlots,
    companions:companions.filter(c=>c.alive).map(c=>({x:c.x,y:c.y,type:c.type,hp:c.hp})),
    items:items.filter(i=>!i.collected).map(i=>({x:i.x,y:i.y,type:i.type,value:i.value})),
    meteorites:meteorites.filter(m=>!m.eaten&&m.landed).map(m=>({x:m.x,y:m.landY,size:m.size})),
    enemies:enemies.filter(e=>e.alive).map(e=>({x:e.x,y:e.y,hp:e.hp,type:e.type})),
    timestamp:Date.now()
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data)); saveNotice=120;}catch(e){}
}
function loadGame(){
  try{
    let raw=localStorage.getItem(SAVE_KEY); if(!raw)return false;
    let d=JSON.parse(raw);
    alien.x=d.alien.x; alien.y=d.alien.y; alien.hp=d.alien.hp; alien.maxHp=d.alien.maxHp;
    alien.money=d.alien.money; alien.fragments=d.alien.fragments; alien.weaponLevel=d.alien.weaponLevel;
    alien.armorLevel=d.alien.armorLevel||0; alien.speedLevel=d.alien.speedLevel||0;
    alien.hasSpaceship=d.alien.hasSpaceship; alien.carriedTreasures=d.alien.carriedTreasures||0;
    gameState=d.gameState; spaceProgress=d.spaceProgress||0; shipCargo=d.shipCargo||0; shipMaxCargo=d.shipMaxCargo||10;
    shipLevel=d.shipLevel||0; shipSpeed=d.shipSpeed||1; homeStorage=d.homeStorage||0; companionSlots=d.companionSlots||0;
    items=d.items.map(i=>{let it=new Item(i.x,i.y,i.type); if(i.value)it.value=i.value; return it;});
    meteorites=[]; if(d.meteorites)d.meteorites.forEach(m=>{let met=new Meteorite(m.x,m.y); met.landed=true; met.y=m.y; met.landY=m.y; met.size=m.size; meteorites.push(met);});
    enemies=[]; if(d.enemies)d.enemies.forEach(e=>{let en=new Enemy(e.x,e.y,e.type); en.hp=e.hp; enemies.push(en);});
    companions=[]; if(d.companions)d.companions.forEach(c=>{let comp=new Companion(c.x,c.y,c.type); comp.hp=c.hp; companions.push(comp);});
    if(gameState==='spaceToHome'&&!alien.hasSpaceship)alien.hasSpaceship=true;
    saveNotice=120; return true;
  }catch(e){return false;}
}
function deleteSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function hasSave(){try{return localStorage.getItem(SAVE_KEY)!==null;}catch(e){return false;}}

// ═══════════ 地形 ═══════════
function generateTerrain(){
  terrainMap=[]; let step=60;
  for(let x=0;x<CONFIG.worldW;x+=step)for(let y=0;y<CONFIG.worldH;y+=step){let n=noise(x*0.002,y*0.002)*noise(x*0.005,y*0.005+100); terrainMap.push({x,y,type:n>0.45?'grass':'dirt',detail:n});}
  for(let i=0;i<50;i++)terrainMap.push({x:random(100,CONFIG.worldW-100),y:random(100,CONFIG.worldH-100),type:'rock',detail:0});
  for(let i=0;i<80;i++)terrainMap.push({x:random(100,CONFIG.worldW-100),y:random(100,CONFIG.worldH-100),type:'flower',detail:random(0.3,1)});
  for(let i=0;i<8;i++){let sx=random(300,CONFIG.worldW-300),sy=random(300,CONFIG.worldH-300); for(let j=0;j<8;j++)terrainMap.push({x:sx+random(-80,80),y:sy+random(-80,80),type:'special',detail:0});}
}
function generateHomeTerrain(){
  homeTerrain=[]; let step=50;
  for(let x=0;x<CONFIG.homeWorldW;x+=step)for(let y=0;y<CONFIG.homeWorldH;y+=step){let n=noise(x*0.003,y*0.003+200); homeTerrain.push({x,y,type:n>0.5?'silver':'white',detail:n});}
  for(let i=0;i<30;i++)homeTerrain.push({x:random(100,CONFIG.homeWorldW-100),y:random(100,CONFIG.homeWorldH-100),type:'crystal',detail:0});
  for(let i=0;i<15;i++)homeTerrain.push({x:random(100,CONFIG.homeWorldW-100),y:random(100,CONFIG.homeWorldH-100),type:'building',detail:0});
}

function draw(){
  if(titleScreen){drawTitleScreen(); return;}
  if(gameState==='earth')drawEarth();
  else if(gameState==='spaceToHome'||gameState==='spaceToEarth')drawSpaceFlight();
  else if(gameState==='landingHome'||gameState==='landingEarth')drawLanding();
  else if(gameState==='home')drawHomePlanet();
  else if(gameState==='win')drawWinScreen();

  frameCountSinceSave++;
  if(frameCountSinceSave>=600&&(gameState==='earth'||gameState==='home')&&alien.hp>0){saveGame(); frameCountSinceSave=0;}

function mousePressed(){
  if(!titleScreen)return;
  let hasSaveFile=hasSave(); let opts=[];
  if(hasSaveFile){opts.push({label:'continue',y1:height*0.72-16,y2:height*0.72+20}); opts.push({label:'new',y1:height*0.82-16,y2:height*0.82+20}); opts.push({label:'delete',y1:height*0.92-16,y2:height*0.92+20});}
  else{opts.push({label:'new',y1:height*0.82-16,y2:height*0.82+20});}
  for(let opt of opts){if(mouseX>width/2-140&&mouseX<width/2+140&&mouseY>opt.y1&&mouseY<opt.y2){
    if(opt.label==='continue'){if(loadGame()){titleScreen=false; showAchievement('💾 存档已加载！');}}
    else if(opt.label==='new'){deleteSave(); resetGame(); titleScreen=false; showAchievement('🎮 新冒险！收集宝物运回家园！');}
    else if(opt.label==='delete'){deleteSave(); showAchievement('🗑️ 存档已删除');}
  }}
}

// ═══════════ 地球阶段 ═══════════
function drawEarth(){
  camera.x=lerp(camera.x,alien.x,0.08); camera.y=lerp(camera.y,alien.y,0.08);
  let shakeX=0,shakeY=0; if(shakeAmount>0.1){shakeX=random(-shakeAmount,shakeAmount); shakeY=random(-shakeAmount,shakeAmount); shakeAmount*=0.85;}
  push(); translate(shakeX,shakeY);
  background('#1a3a1a');
  for(let t of terrainMap){let sx=t.x-camera.x+width/2, sy=t.y-camera.y+height/2; if(sx<-70||sx>width+70||sy<-70||sy>height+70)continue; noStroke();
    if(t.type==='grass'){fill(noise(t.x*0.03,t.y*0.03)>0.5?PAL.ground1:PAL.ground2); rect(sx-30,sy-30,60,60);}
    else if(t.type==='dirt'){fill(PAL.ground3); rect(sx-30,sy-30,60,60);}
    else if(t.type==='rock'){fill(140,130,120); ellipse(sx,sy,18,14); fill(160,150,140); ellipse(sx-2,sy-2,10,8);}
    else if(t.type==='flower'){fill(lerpColor(color('#ff6b9d'),color('#c44dff'),t.detail)); ellipse(sx,sy,6,8);}
    else if(t.type==='special'){fill(100,80,40,100); ellipse(sx,sy,30,30);}}
  for(let s of stars){s.twinkle+=s.speed; let a=sin(s.twinkle)*0.5+0.5; let sx=s.x-camera.x*0.3+width/2, sy=s.y-camera.y*0.3+height/2; if(sx<-10||sx>width+10||sy<-10||sy>height+10)continue; fill(255,255,255,a*200); noStroke(); ellipse(sx,sy,s.size,s.size);}
  for(let item of items){if(!item.collected){item.update(); item.draw(camera);}}
  for(let met of meteorites){if(!met.eaten){met.update(); met.draw(camera);}}
  for(let enemy of enemies){enemy.update(); enemy.draw(camera);}
  for(let comp of companions){comp.update(); comp.draw(camera);}
  alien.update(); alien.draw(camera);
  for(let i=particles.length-1;i>=0;i--){particles[i].update(); particles[i].draw(camera); if(particles[i].dead)particles.splice(i,1);}
  pop();
  drawHUD(); drawAchievement(); drawSaveNotice(); if(shopOpen)drawShop();
  // 生成
  if(frameCount%CONFIG.meteorInterval===0){let mx=camera.x+random(-width/2,width/2); meteorites.push(new Meteorite(mx,camera.y-height/2-20));}
  if(frameCount%CONFIG.treasureInterval===0){let tx=camera.x+random(-width/2*1.2,width/2*1.2),ty=camera.y+random(-height/2*1.2,height/2*1.2); tx=constrain(tx,80,CONFIG.worldW-80); ty=constrain(ty,80,CONFIG.worldH-80); items.push(new Item(tx,ty,random()<0.75?'treasure':'fragment'));}
  if(frameCount%CONFIG.enemySpawnInterval===0&&enemies.filter(e=>e.alive).length<10){let ex=camera.x+random(-width,width),ey=camera.y+random(-height,height); ex=constrain(ex,80,CONFIG.worldW-80); ey=constrain(ey,80,CONFIG.worldH-80); let r=random(); if(r<0.4)enemies.push(new Enemy(ex,ey,'critter')); else if(r<0.8)enemies.push(new Enemy(ex,ey,'beast')); else enemies.push(new Enemy(ex,ey,'guardian'));}
  items=items.filter(i=>!i.collected); meteorites=meteorites.filter(m=>!m.eaten); enemies=enemies.filter(e=>e.alive);
}

// ═══════════ 家园星球 ═══════════
function drawHomePlanet(){
  camera.x=lerp(camera.x,alien.x,0.08); camera.y=lerp(camera.y,alien.y,0.08);
  background('#d8d8e8');
  for(let t of homeTerrain){let sx=t.x-camera.x+width/2, sy=t.y-camera.y+height/2; if(sx<-60||sx>width+60||sy<-60||sy>height+60)continue; noStroke();
    if(t.type==='white'){fill(240,240,250); rect(sx-25,sy-25,50,50);}
    else if(t.type==='silver'){fill(220,220,235); rect(sx-25,sy-25,50,50);}
    else if(t.type==='crystal'){fill(180,200,255,150); ellipse(sx,sy,14,20); fill(200,220,255,100); ellipse(sx,sy-3,8,12);}
    else if(t.type==='building'){fill(PAL.homeBuilding); rect(sx-20,sy-20,40,40,6); fill(255,255,255,100); rect(sx-14,sy-14,12,12,2);}}
  alien.update(); alien.draw(camera);
  for(let comp of companions){comp.update(); comp.draw(camera);}
  for(let i=particles.length-1;i>=0;i--){particles[i].update(); particles[i].draw(camera); if(particles[i].dead)particles.splice(i,1);}

  }

}

// ═══════════ 发射动画 ═══════════
function drawLaunching(){
  launchTimer++;
  if(launchTimer<60){
    // 缩放离开地球
    background(10+launchTimer*0.2,20,launchTimer*0.3+10); // HSB: 暗绿渐变到暗蓝
    let scale=map(launchTimer,0,60,1,0.3);
    push(); translate(width/2,height/2); scale(scale);
    fill(120,80,40); noStroke(); rect(-500,-400,1000,800); // 地球色(HSB)
    fill(120,80,80); ellipse(0,0,22,20); // 外星人
    pop();
    fill(0,0,0,map(launchTimer,0,60,0,0.6)); noStroke(); rect(0,0,width,height);
    // 火焰尾迹
    for(let i=0;i<8;i++){
      let fy=height-40+random(-5,5), fx=width/2+random(-20,20);
      fill(30,100,100,1-launchTimer*0.015); noStroke();
      ellipse(fx,fy+launchTimer*2,random(4,10),random(8,20));
    }
    fill(0,0,100); textAlign(CENTER); textSize(26); text('🚀 起飞中...',width/2,height-50);
  }else if(launchTimer<120){
    background(240,20,20); // 暗蓝色
    for(let i=0;i<50;i++){let sy=(i*17+launchTimer*3)%height; fill(40,80,100,0.6-sy/height*0.5); noStroke(); rect(0,sy,width,2);}
    fill(0,0,80); textAlign(CENTER); textSize(20); text('穿过大气层...',width/2,height-40);
  }else{
    if(gameState==='launching'){
      if(alien.carriedTreasures>0){shipCargo=alien.carriedTreasures; alien.carriedTreasures=0;}
      startSpaceFlight();
    }
  }
  // 安全阀：最多150帧强制进入太空
  if(launchTimer>150&&gameState==='launching'){
    if(alien.carriedTreasures>0){shipCargo=alien.carriedTreasures; alien.carriedTreasures=0;}
    startSpaceFlight();
  }
}

// ═══════════ 太空飞行（玩家控制） ═══════════
function drawSpaceFlight(){
  let goingHome=gameState==='spaceToHome';
  // 玩家控制飞船
  let moveSpd=4;
  if(keyIsDown(65)||keyIsDown(LEFT_ARROW))shipVX-=0.3;
  if(keyIsDown(68)||keyIsDown(RIGHT_ARROW))shipVX+=0.3;
  if(keyIsDown(87)||keyIsDown(UP_ARROW))shipVY-=0.3;
  if(keyIsDown(83)||keyIsDown(DOWN_ARROW))shipVY+=0.3;
  // 空格助推
  if(keyIsDown(32)&&shipFuel>0){let boost=1.8; spaceProgress+=CONFIG.spaceSpeed*shipSpeed*boost*0.6; shipFuel-=0.3;}
  else{spaceProgress+=CONFIG.spaceSpeed*shipSpeed;}
  // 减速
  shipVX*=0.95; shipVY*=0.95;
  shipX+=shipVX; shipY+=shipVY;
  shipX=constrain(shipX,40,width-40); shipY=constrain(shipY,60,height-60);
  if(shipFuel<shipMaxFuel&&!keyIsDown(32))shipFuel=min(shipMaxFuel,shipFuel+0.05);

  let progress=min(1,spaceProgress/CONFIG.spaceFlightDuration);
  let distKm=floor(progress*CONFIG.homeDistance);

  background(5,5,20);
  // 星空视差
  for(let i=0;i<200;i++){let sx=((i*137+spaceProgress*(0.3+(i%4)*0.3))%width); let sy=(i*73+sin(i+spaceProgress*0.002)*40)%height; if(sy<0)sy+=height; fill(0,0,100,0.3+(i%3)*0.3); noStroke(); ellipse(sx,sy,1+(i%3)*1.2,1+(i%3)*1.2);}
  // 太阳
  let sunX=goingHome?width*0.12:width*0.88, sunY=height*0.18;
  drawingContext.shadowBlur=40; drawingContext.shadowColor='#ffdd44'; fill(50,90,100); noStroke(); ellipse(sunX,sunY,50,50); drawingContext.shadowBlur=0;

  // 地球 (HSB: H=200蓝 S=70 B=90)
  let eX=goingHome?width*0.85-spaceProgress*0.3:20+progress*width*0.8, eSize=goingHome?lerp(50,6,progress):lerp(6,50,progress);
  if(eSize>2){fill(200,70,90); noStroke(); ellipse(eX,height*0.7,eSize,eSize); fill(120,70,60); arc(eX,height*0.7,eSize,eSize,0,PI);}

  // 白色星球
  let hX=goingHome?20+progress*width*0.8:width*0.85-spaceProgress*0.3, hSize=goingHome?lerp(6,60,progress):lerp(60,6,progress);
  if(hSize>2){drawingContext.shadowBlur=min(hSize,30); drawingContext.shadowColor='#f8f8ff'; fill(240,5,100); noStroke(); ellipse(hX,height*0.3,hSize,hSize); drawingContext.shadowBlur=0;}

  // 障碍物
  for(let r of spaceRocks){r.x-=r.speed; if(r.x<-60){r.x=width+random(50,300); r.y=random(60,height-60);} fill(30,10,50); noStroke(); ellipse(r.x,r.y,r.size,r.size*0.8); fill(30,5,60); ellipse(r.x-2,r.y-2,r.size*0.4,r.size*0.35);
    if(dist(shipX,shipY,r.x,r.y)<r.size+18){spaceProgress=max(0,spaceProgress-20); shakeAmount=6; for(let i=0;i<10;i++)particles.push(new Particle(shipX,shipY,'#ff8844',3));}}

  // 飞船
  push(); translate(shipX,shipY);
  fill(210,20,80); stroke(210,10,60); strokeWeight(1.5);
  beginShape(); vertex(22,0); vertex(8,-12); vertex(-12,-14); vertex(-22,-7); vertex(-22,7); vertex(-12,14); vertex(8,12); endShape(CLOSE);
  fill(200,60,90,0.8); noStroke(); ellipse(13,0,9,9); fill(0,0,100,0.4); ellipse(12,-1,3,3);
  fill(210,15,70); stroke(210,10,60); strokeWeight(1); triangle(-4,-8,-14,-22,-14,-8); triangle(-4,8,-14,22,-14,8);
  fill(30,80,90,0.7); noStroke(); ellipse(-22,0,8,6);
  if(keyIsDown(32)&&shipFuel>0){let fl=14+sin(frameCount*0.4)*5; fill(20,90,100,0.6); triangle(-22,-3,-22-fl,0,-22,3);}
  else{let fl=7+sin(frameCount*0.3)*3; fill(20,90,100,0.4); triangle(-22,-2,-22-fl,0,-22,2);}
  stroke(210,5,90); strokeWeight(1); line(4,-12,4,-20); fill(0,100,100); noStroke(); ellipse(4,-20,3,3);
  pop();

  if(frameCount%2===0&&keyIsDown(32)){particles.push(new Particle(shipX-22,shipY+random(-4,4),'#ff8844',random(2,4)));}
  for(let i=particles.length-1;i>=0;i--){let p=particles[i]; p.x-=2; p.update(); p.draw({x:0,y:0}); if(p.dead)particles.splice(i,1);}

  // HUD
  push(); fill(PAL.uiBg); noStroke(); rect(0,0,width,50);
  fill(PAL.fragGlow); textAlign(CENTER); textSize(15);
  let dest=goingHome?'家园星球':'地球';
  text(`🚀 飞往 ${dest}  ${floor(distKm).toLocaleString()}/${CONFIG.homeDistance.toLocaleString()}km`,width/2,20);
  let bW=width*0.5, bX=(width-bW)/2; fill(240,20,20); rect(bX,26,bW,10,5);
  // 进度条: 蓝色→白色渐变 (用 HSB hue 220→240)
  let barHue=goingHome?lerp(220,240,progress):lerp(240,220,progress);
  fill(barHue,60,90); rect(bX,26,bW*progress,10,5);
  fill(PAL.uiText); textSize(10);
  text(`⛽ ${floor(shipFuel)}% (空格助推)`,width-80,20);
  text('WASD操控飞船',width-80,42);
  pop();
  drawAchievement();

  if(shakeAmount>0.1){shakeAmount*=0.85;}

  // 到达
  if(progress>=1){
    gameState=goingHome?'landingHome':'landingEarth'; landingTimer=0;
    showAchievement(goingHome?'🌟 即将到达家园星球！':'🌍 即将到达地球！');
  }
}

// ═══════════ 着陆动画 ═══════════
function drawLanding(){
  landingTimer++;
  let goingHome=gameState==='landingHome';
  let prog=min(1,landingTimer/120);

  background(5,5,20);
  for(let i=0;i<150;i++){let sx=((i*137+landingTimer*2)%width); fill(0,0,100,0.3+(i%3)*0.3); noStroke(); ellipse(sx,(i*73)%height,1+(i%3)*1.2,1+(i%3)*1.2);}

  // 星球颜色：家园=白(H240 S5 B100)，地球=蓝(H200 S70 B90)
  let pH=goingHome?240:200, pS=goingHome?5:70, pB=goingHome?100:90;
  let planetX=width/2, planetY=height*0.45+prog*80, planetSize=lerp(60,height*1.3,prog);
  drawingContext.shadowBlur=40*(1-prog)+10; drawingContext.shadowColor=goingHome?'#f8f8ff':'#4488cc';
  fill(pH,pS,pB); noStroke(); ellipse(planetX,planetY,planetSize,planetSize);
  drawingContext.shadowBlur=0;
  if(goingHome){fill(240,3,95,0.2); ellipse(planetX-planetSize*0.15,planetY-planetSize*0.1,planetSize*0.3,planetSize*0.2);}

  let sX=width/2+sin(landingTimer*0.03)*25, sY=height*0.28+prog*40;
  push(); translate(sX,sY); scale(lerp(1,0.4,prog));
  fill(210,20,80); stroke(210,10,60); strokeWeight(1); beginShape(); vertex(20,0); vertex(7,-10); vertex(-10,-12); vertex(-20,-6); vertex(-20,6); vertex(-10,12); vertex(7,10); endShape(CLOSE);
  fill(200,60,90,0.6); noStroke(); ellipse(11,0,8,8);
  pop();

  if(prog>0.5&&frameCount%2===0)particles.push(new Particle(sX,sY+15,PAL.landingGreen,random(1,4)));
  for(let i=particles.length-1;i>=0;i--){let p=particles[i]; p.update(); p.draw({x:0,y:0}); if(p.dead)particles.splice(i,1);}

  push(); fill(PAL.uiBg); noStroke(); rect(0,0,width,40);
  fill(goingHome?'#f8f8ff':'#88ccff'); textAlign(CENTER); textSize(16);
  text(prog<0.5?'🛬 着陆中...':(prog<0.9?'即将抵达...':'✨ 着陆成功！'),width/2,26); pop();
  drawAchievement();

  if(prog>=1){
    if(goingHome){
      gameState='home'; alien.x=CONFIG.homeWorldW/2; alien.y=CONFIG.homeWorldH/2;
      camera={x:alien.x,y:alien.y};
      // 卸载货物
      if(shipCargo>0){homeStorage+=shipCargo; showAchievement(`📦 ${shipCargo}件宝物已存入家园仓库！总计: ${homeStorage}`); shipCargo=0;}
      // 解锁同伴槽位
      let newSlots=floor(homeStorage/10);
      if(newSlots>companionSlots){companionSlots=min(2,newSlots); showAchievement(`👥 解锁同伴槽位！(${companionSlots}/2)`);}
      alien.hp=alien.maxHp;
      for(let c of companions)c.hp=c.maxHp;
    }else{
      gameState='earth'; alien.x=CONFIG.worldW/2; alien.y=CONFIG.worldH/2;
      camera={x:alien.x,y:alien.y}; alien.carriedTreasures=0;
      shipCargo=0;
    }
    saveGame();
  }
}

// ═══════════ 输入 ═══════════
function keyPressed(){
  if(titleScreen)return false;
  if((key==='r'||key==='R')&&alien.hp<=0){deleteSave(); resetGame(); shopOpen=false; showAchievement('🔄 重新开始！'); return false;}

  if(gameState==='earth'&&alien.hp>0){
    if(key==='b'||key==='B'){shopOpen=!shopOpen; if(!shopOpen)saveGame(); return false;}
    if(key===' '){alien.attack(); return false;}
    // 起飞 (Enter/F/L)
    let lk=(key==='f'||key==='F'||key==='Enter'||key==='l'||key==='L');
    if(lk&&alien.hasSpaceship){shopOpen=false; launchToHome(); return false;}
    if(lk&&!alien.hasSpaceship){showAchievement('⚠ 需要20个碎片！当前:'+alien.fragments+'/20'); return false;}
    if(key==='m'||key==='M'){saveGame(); showAchievement('💾 存档完成'); return false;}

    // ═══ 商店内购买 (inline, 同v2) ═══
    if(shopOpen){
      // 标签切换
      if(key==='Tab'||keyCode===9||key==='q'||key==='Q'){
        let tabs=gameState==='home'?['weapon','armor','speed','ship','companion']:['weapon','armor','speed','ship'];
        let idx=tabs.indexOf(shopTab);
        if(key==='q'||key==='Q')idx=(idx-1+tabs.length)%tabs.length;
        else idx=(idx+1)%tabs.length;
        shopTab=tabs[idx];
      }
      // 武器
      if(shopTab==='weapon'){let wk=parseInt(key); if(wk>=1&&wk<=4){let tl=wk-1; let cs=[0,30,80,100]; if(tl>alien.weaponLevel&&alien.money>=cs[tl]){alien.money-=cs[tl]; alien.weaponLevel=tl; showAchievement('⚔️ '+alien.weaponName+' ATK:'+alien.weaponDamage); saveGame();}}}
      // 护甲
      if(shopTab==='armor'){let ak=parseInt(key); if(ak>=1&&ak<=3){let cs=[0,40,90,150]; if(ak>alien.armorLevel&&alien.money>=cs[ak]){alien.money-=cs[ak]; alien.armorLevel=ak; showAchievement('🛡️ '+alien.armorName+' -'+floor(alien.armorReduction*100)+'%'); saveGame();}}}
      // 速度
      if(shopTab==='speed'){let sk=parseInt(key); if(sk>=1&&sk<=3){let cs=[0,35,75,140]; if(sk>alien.speedLevel&&alien.money>=cs[sk]){alien.money-=cs[sk]; alien.speedLevel=sk; showAchievement('👢 '+alien.speedName+' ×'+alien.speedBoosts[alien.speedLevel]); saveGame();}}}
      // 飞船 (按数字键1-4购买对应等级，同武器)
      if(shopTab==='ship'){let sk=parseInt(key); if(sk>=1&&sk<=4){let tl=sk-1; let sc=[0,50,120,250],cc=[10,18,30,50],ss=[1,1.3,1.7,2.2]; if(tl>shipLevel&&alien.money>=sc[tl]){alien.money-=sc[tl]; shipLevel=tl; shipMaxCargo=cc[tl]; shipSpeed=ss[tl]; showAchievement('🚀 飞船升级！货舱:'+shipMaxCargo+' 速度:×'+shipSpeed); saveGame();}}}
      // 同伴
      if(shopTab==='companion'){
        if(key==='1'&&companionSlots>=1&&!companions.some(c=>c.type==='scout'&&c.alive)&&alien.money>=60){alien.money-=60; companions.push(new Companion(alien.x,alien.y,'scout')); showAchievement('💗 侦察兵加入！'); saveGame();}
        if(key==='2'&&companionSlots>=2&&!companions.some(c=>c.type==='fighter'&&c.alive)&&alien.money>=120){alien.money-=120; companions.push(new Companion(alien.x,alien.y,'fighter')); showAchievement('💙 战士加入！'); saveGame();}
      }
      return false;
    }
    return false;
  }

  if(gameState==='home'){
    if(key==='b'||key==='B'){shopOpen=!shopOpen; if(!shopOpen)saveGame(); return false;}
    let lk=(key==='f'||key==='F'||key==='Enter'||key==='l'||key==='L');
    if(lk){shopOpen=false; launchToEarth(); return false;}
    if(key==='m'||key==='M'){saveGame(); showAchievement('💾 存档完成'); return false;}
    // 商店 (同earth)
    if(shopOpen){
      if(key==='Tab'||keyCode===9||key==='q'||key==='Q'){
        let tabs=['weapon','armor','speed','ship','companion'];
        let idx=tabs.indexOf(shopTab);
        if(key==='q'||key==='Q')idx=(idx-1+tabs.length)%tabs.length;
        else idx=(idx+1)%tabs.length;
        shopTab=tabs[idx];
      }
      if(shopTab==='weapon'){let wk=parseInt(key); if(wk>=1&&wk<=4){let tl=wk-1; let cs=[0,30,80,100]; if(tl>alien.weaponLevel&&alien.money>=cs[tl]){alien.money-=cs[tl]; alien.weaponLevel=tl; showAchievement('⚔️ '+alien.weaponName+' ATK:'+alien.weaponDamage); saveGame();}}}
      if(shopTab==='armor'){let ak=parseInt(key); if(ak>=1&&ak<=3){let cs=[0,40,90,150]; if(ak>alien.armorLevel&&alien.money>=cs[ak]){alien.money-=cs[ak]; alien.armorLevel=ak; showAchievement('🛡️ '+alien.armorName+' -'+floor(alien.armorReduction*100)+'%'); saveGame();}}}
      if(shopTab==='speed'){let sk=parseInt(key); if(sk>=1&&sk<=3){let cs=[0,35,75,140]; if(sk>alien.speedLevel&&alien.money>=cs[sk]){alien.money-=cs[sk]; alien.speedLevel=sk; showAchievement('👢 '+alien.speedName+' ×'+alien.speedBoosts[alien.speedLevel]); saveGame();}}}
      if(shopTab==='ship'&&key==='5'){let nl=shipLevel+1; let sc=[0,50,120,250],cc=[10,18,30,50],ss=[1,1.3,1.7,2.2]; if(nl<=3&&alien.money>=sc[nl]){alien.money-=sc[nl]; shipLevel=nl; shipMaxCargo=cc[nl]; shipSpeed=ss[nl]; showAchievement('🚀 飞船升级！货舱:'+shipMaxCargo+' 速度:×'+shipSpeed); saveGame();}}
      if(shopTab==='companion'){
        if(key==='1'&&companionSlots>=1&&!companions.some(c=>c.type==='scout'&&c.alive)&&alien.money>=60){alien.money-=60; companions.push(new Companion(alien.x,alien.y,'scout')); showAchievement('💗 侦察兵加入！'); saveGame();}
        if(key==='2'&&companionSlots>=2&&!companions.some(c=>c.type==='fighter'&&c.alive)&&alien.money>=120){alien.money-=120; companions.push(new Companion(alien.x,alien.y,'fighter')); showAchievement('💙 战士加入！'); saveGame();}
      }
      return false;
    }
    return false;
  }
  return false;
}

function mouseReleased(){
  if(!shopOpen||(gameState!=='earth'&&gameState!=='home'))return;
  let tabs=gameState==='home'?[{id:'weapon',l:'⚔️ 武器'},{id:'armor',l:'🛡️ 护甲'},{id:'speed',l:'👢 速度'},{id:'ship',l:'🚀 飞船'},{id:'companion',l:'👥 同伴'}]:[{id:'weapon',l:'⚔️ 武器'},{id:'armor',l:'🛡️ 护甲'},{id:'speed',l:'👢 速度'},{id:'ship',l:'🚀 飞船'}];
  let tabW=width/tabs.length;
  for(let i=0;i<tabs.length;i++){if(mouseX>i*tabW&&mouseX<(i+1)*tabW&&mouseY<44)shopTab=tabs[i].id;}
}
</script>
