<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通识工具 · 可豆妈妈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
.nav{position:sticky;top:0;z-index:10;background:rgba(10,10,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;padding:0 20px;height:52px}
.nav-back{color:#ffd200;text-decoration:none;font-size:.9em;display:inline-flex;align-items:center;gap:6px}
.nav-back:hover{color:#fff}
.container{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:20px 20px 60px}
.hero{text-align:center;padding:24px 0}
.hero h1{font-size:1.8em;background:linear-gradient(135deg,#66bb6a,#aed581);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subcat{margin:20px 0 12px}
.subcat-title{font-size:1em;color:#888;margin-bottom:10px;padding-left:4px;display:flex;align-items:center;gap:8px}
.subcat-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.tools{display:flex;flex-direction:column;gap:8px}
.tool{display:flex;align-items:center;gap:12px;padding:16px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;text-decoration:none;color:#e0e0e0;transition:all .2s}
.tool:hover{border-color:rgba(102,187,106,.4);background:rgba(102,187,106,.05)}
.tool-icon{font-size:1.8em;flex-shrink:0}
.tool-info{flex:1;min-width:0}
.tool-name{font-size:1em;font-weight:600;color:#66bb6a;margin-bottom:2px}
.tool-desc{font-size:.8em;color:#888;line-height:1.4}
.tool-arrow{color:#555;font-size:1.1em}
.placeholder{color:#555;font-size:.85em;text-align:center;padding:30px 0}
.footer{text-align:center;color:#444;font-size:.78em;margin-top:40px}
@media(max-width:500px){
  .nav-inner{padding:0 14px;height:48px}
  .hero h1{font-size:1.4em}.container{padding:16px 14px 50px}
  .tool{padding:14px}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<nav class="nav"><div class="nav-inner">
  <a href="/" class="nav-back">◀ 助学工具</a>
</div></nav>
<div class="container">
  <div class="hero"><h1>🌍 通识</h1></div>

  <!-- 百科探索 -->
  <div class="subcat">
    <div class="subcat-title">📚 百科探索</div>
    <div class="placeholder">工具开发中…</div>
  </div>

  <div class="footer">关注公众号「可豆妈妈」获取最新通识工具</div>
</div>
<script>
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<40;i++){
    var s=document.createElement('div');s.className='star';
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*3+1)+'px;height:'+s.style.width+';--d:'+(Math.random()*3+2)+'s';
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
