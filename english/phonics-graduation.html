<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>毕业典礼 · 自然拼读</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite;animation-delay:var(--delay)}@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes slideIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.container{position:relative;z-index:1;max-width:850px;margin:0 auto;padding:20px}.glass{background:rgba(255,255,255,.04);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 24px;margin:20px 0;animation:slideIn .6s ease-out both}
h1{font-size:1.9em;text-align:center;background:linear-gradient(135deg,#ff8a65,#ffd200,#81c784,#80deea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}h2{color:#ffd200;font-size:1.3em;margin-bottom:14px;display:flex;align-items:center;gap:8px}.subtitle{text-align:center;color:#aaa;margin-bottom:12px;font-size:.9em}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}.nav-btn{padding:9px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#ccc;cursor:pointer;font-size:.9em;transition:all .3s;min-height:40px}.nav-btn:hover,.nav-btn.active{background:rgba(255,210,0,.12);border-color:#ffd200;color:#ffd200}
.btn{padding:10px 22px;border-radius:22px;border:none;cursor:pointer;font-size:1em;font-weight:600;transition:all .3s}.btn-gold{background:linear-gradient(135deg,#ff8a65,#ffd200);color:#1a1a2e}.btn-gold:hover{transform:scale(1.05)}.btn-outline{background:transparent;color:#ccc;border:1px solid rgba(255,255,255,.3)}.btn-outline:hover{border-color:#ffd200;color:#ffd200}.btn-outline:disabled{opacity:.35;cursor:default}
.section{display:none}.section.active{display:block}
.speak-btn{background:rgba(255,210,0,.15);border:1px solid rgba(255,210,0,.25);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:.7em;transition:all .2s;flex-shrink:0;color:#ffd200}.speak-btn:hover{background:rgba(255,210,0,.3);transform:scale(1.2)}.speak-btn.speaking{animation:pulse .3s;background:rgba(255,210,0,.4)}

/* ===== 知识回顾 · 拼读大树 ===== */
.khint{text-align:center;color:#888;font-size:.85em;margin-bottom:12px}
.kstage{border:1px solid rgba(255,255,255,.1);border-left:5px solid var(--c);border-radius:16px;margin:16px 0;background:rgba(0,0,0,.2);overflow:hidden}
.kstage-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;background:rgba(255,255,255,.03)}
.kstage-icon{font-size:1.6em}.kstage-name{font-weight:bold;font-size:1.12em;color:var(--c)}.kstage-intro{font-size:.78em;color:#999;margin-left:auto;text-align:right;max-width:45%}
.kstage-fold{margin-left:8px;color:#888;font-size:.8em;transition:transform .3s}.kstage.collapsed .kstage-fold{transform:rotate(-90deg)}
.kstage-body{padding:4px 14px 14px}
.kstage.collapsed .kstage-body{display:none}
.ksub{margin:10px 0 4px;padding-left:14px;border-left:3px solid var(--c)}
.ksub-name{font-weight:bold;color:#fff;font-size:.95em;margin-bottom:6px}
.kcard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin:6px 0 6px 10px}
.kcard-title{font-weight:bold;color:var(--c);font-size:.92em;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.kcard-rule{font-size:.85em;color:#ccc;line-height:1.55;margin-bottom:6px}
.kcard-words{display:flex;flex-wrap:wrap;gap:6px}
.kword{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 9px;font-size:.85em;color:#fff;cursor:pointer;transition:all .2s}
.kword:hover{background:rgba(255,255,255,.12);border-color:var(--c)}
.kword b{color:#ffd200;font-weight:600;font-size:.85em}
.kword .sp{color:#ffd200}

/* ===== 绘本 ===== */
.magic-rule{background:rgba(255,210,0,.08);border:2px dashed rgba(255,210,0,.3);border-radius:16px;padding:12px 16px;margin:12px 0;text-align:center;font-size:.92em;line-height:1.6}
.book-wrap{max-width:560px;margin:0 auto}
.book-page{background:rgba(255,255,255,.03);border-radius:20px;padding:24px 20px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.book-scene{font-size:3.6em;margin:8px 0;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(255,210,0,.3))}
.book-title{font-size:1.35em;color:#ffd200;font-weight:bold;margin:4px 0 12px}
.book-text{font-size:1.14em;line-height:2.2;color:#e8e8e8;max-width:480px}
.pw{color:#ffd200;font-weight:bold;cursor:pointer;border-bottom:1.5px dashed rgba(255,210,0,.55);padding:0 1px;border-radius:3px;transition:all .15s}
.pw:hover{background:rgba(255,210,0,.14)}
.book-pron{display:flex;gap:8px;justify-content:center;margin-top:14px}
.pron-btn{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#ccc;cursor:pointer;font-size:.85em;transition:all .3s}.pron-btn.uk{border-color:rgba(79,195,247,.4)}.pron-btn.us{border-color:rgba(239,154,154,.4)}.pron-btn.playing{animation:pulse .3s;pointer-events:none}
.book-nav{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px}
.book-pagenum{color:#888;font-size:.9em;min-width:110px;text-align:center}
.book-progress{margin:14px auto 0;max-width:560px}.pbar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}.pbar .fill{height:100%;background:linear-gradient(90deg,#ff8a65,#ffd200);transition:width .3s}

/* hover 词卡 */
.wpop{position:fixed;z-index:70;background:#1a1a2e;border:2px solid #ffd200;border-radius:16px;padding:14px 16px;max-width:300px;box-shadow:0 12px 40px rgba(0,0,0,.7);animation:pop .2s;display:none}
.wpop .wi{font-size:2em;text-align:center}
.wpop .ww{font-size:1.6em;font-weight:bold;color:#ffd200;text-align:center;margin:2px 0;letter-spacing:1px}
.wpop .wc{font-size:.95em;color:#e0e0e0;text-align:center;margin-bottom:6px}
.wpop .wr{font-size:.82em;color:#bbb;line-height:1.55;text-align:center}
.wseg{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:7px 0 3px}
.wseg-item{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.28);border-radius:8px;padding:4px 7px;min-width:32px}
.wseg-let{font-weight:bold;font-size:1.3em;line-height:1.2}
.wseg-ipa{font-size:.72em;color:#ffd200}
.wst{font-size:.78em;color:#4fc3f7;line-height:1.5;text-align:center;margin:4px 0 1px;background:rgba(79,195,247,.08);border-radius:8px;padding:3px 8px}
.wsyll{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0 2px;align-items:stretch}
.wsyll-item{display:flex;flex-direction:column;align-items:center;background:rgba(255,210,0,.07);border:1px solid rgba(255,210,0,.22);border-radius:10px;padding:5px 9px;min-width:46px}
.wsyll-syll{font-weight:bold;font-size:1.3em;color:#ffd200;line-height:1.2}
.wsyll-ipa{font-size:.7em;color:#ff8a65;margin:2px 0}
.wsyll-st{font-size:.68em;color:#bbb;line-height:1.3;text-align:center;max-width:70px}
.wsyll-sep{align-self:center;color:#ffd200;font-size:1.3em;font-weight:bold}

/* ===== 毕业证书（白底）===== */
.cert{background:#fff;color:#333;border:3px double #c9a63c;border-radius:14px;padding:28px 22px 26px;text-align:center;max-width:520px;margin:0 auto;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.cert-ribbon{display:inline-block;background:linear-gradient(135deg,#ff8a65,#ffd200);color:#1a1a2e;font-weight:bold;padding:5px 22px;border-radius:20px;font-size:.82em;margin:0 auto 14px}
.cert-title{font-size:1.9em;font-weight:bold;color:#b8860b;letter-spacing:5px;margin:6px 0 4px}
.cert-en{font-size:.72em;color:#c9a63c;letter-spacing:2px;margin-bottom:14px;text-transform:uppercase}
.cert-body{font-size:.95em;color:#444;line-height:2.1}
.cert-name{background:transparent;border:none;border-bottom:2px dashed #b8860b;color:#b8860b;font-size:1.35em;font-weight:bold;text-align:center;width:62%;padding:4px 0;margin:8px 0}
.cert-date{background:transparent;border:none;border-bottom:2px dashed #b8860b;color:#b8860b;font-size:1em;text-align:center;padding:3px 0;margin:4px 0;max-width:180px}
.cert-seal{font-size:3.2em;margin:12px 0 4px;animation:float 3s ease-in-out infinite}
.cert-foot{display:flex;justify-content:space-between;align-items:center;font-size:.8em;color:#777;margin-top:16px;padding:0 4px;gap:8px}
.cert-actions{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.cert-note{text-align:center;color:#888;font-size:.8em;margin-top:10px}

@media(max-width:768px){
  body{font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  .container{padding:6px;max-width:480px}h1{font-size:1.2em}h2{font-size:.95em}
  .glass{padding:14px 10px;margin:8px 0;border-radius:12px}.subtitle{font-size:.78em;padding:0 4px}
  .nav{gap:4px;margin:6px 0}.nav-btn{padding:10px 10px;font-size:.78em;border-radius:14px;min-height:40px}
  .btn{padding:12px 18px;font-size:.9em;border-radius:20px;min-height:44px}
  .speak-btn{width:38px!important;height:38px!important;font-size:.8em!important;min-width:38px;min-height:38px}
  .kstage-head{padding:12px 12px}.kstage-intro{display:none}.kstage-body{padding:2px 8px 10px}
  .ksub{padding-left:10px}.kcard{margin-left:4px;padding:9px 10px}
  .kcard-title{font-size:.88em}.kcard-rule{font-size:.82em}.kword{padding:5px 8px;font-size:.8em}
  .book-page{padding:16px 10px;min-height:240px;border-radius:14px}.book-scene{font-size:2.6em}.book-title{font-size:1.05em}
  .book-text{font-size:.98em;line-height:2.0;padding:0 4px}
  .cert{padding:28px 16px}.cert-title{font-size:1.4em}.cert-name{width:80%;font-size:1.1em}
}
@media(max-width:480px){
  .container{padding:4px}.glass{padding:12px 6px;margin:6px 0;border-radius:10px}h1{font-size:1.1em}
  .book-text{font-size:.92em;line-height:1.9}
  body{padding-bottom:env(safe-area-inset-bottom,12px)}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div><div class="container">
<h1>🎓 毕业典礼</h1><p class="subtitle">回顾 83 页 → 自己读一本英文绘本 → 领毕业证书</p>
<div class="nav" id="nav"></div>

<!-- 知识回顾（六大阶段，一级标签）-->
<div class="section" id="sec-stage0"><div class="glass"><div id="stageBox0"></div></div></div>
<div class="section" id="sec-stage1"><div class="glass"><div id="stageBox1"></div></div></div>
<div class="section" id="sec-stage2"><div class="glass"><div id="stageBox2"></div></div></div>
<div class="section" id="sec-stage3"><div class="glass"><div id="stageBox3"></div></div></div>
<div class="section" id="sec-stage4"><div class="glass"><div id="stageBox4"></div></div></div>
<div class="section" id="sec-stage5"><div class="glass"><div id="stageBox5"></div></div></div>

<!-- 毕业绘本 -->
<div class="section" id="sec-book"><div class="glass">
<h2>📖 毕业绘本 · The Sound Hunt</h2>
<div class="magic-rule">💡 把手指（或鼠标）放在<span style="color:#ffd200;font-weight:bold">金色单词</span>上，就会弹出它的拼读规则、中文意思和图标。点下面的按钮还能听整页英文朗读。</div>
<div class="book-wrap">
<div class="book-progress"><div class="pbar"><div class="fill" id="bFill"></div></div></div>
<div id="bookPage"></div>
<div class="book-nav" id="bookNav"></div>
</div>
</div></div>

<!-- 毕业证书 -->
<div class="section" id="sec-cert"><div class="glass">
<h2>🎓 毕业证书</h2>
<div class="cert" id="cert">
<div class="cert-ribbon">CERTIFICATE · 毕业证书</div>
<div class="cert-title">毕业证书</div>
<div class="cert-en">Certificate of Completion</div>
<div class="cert-body">
兹证明<br>
<input class="cert-name" placeholder="写下你的名字" id="certName"><br>
已完成 <b style="color:#b8860b">自然拼读全体系</b> 的学习<br>
会<b style="color:#4caf50">拼</b>、会<b style="color:#4caf50">认</b>每一个单词<br>
掌握了 <b style="color:#4caf50">🔍 见词能读</b> · <b style="color:#e67e22">✍️ 听音能写</b> 的独立阅读本领
</div>
<div class="cert-seal">🌟</div>
<div class="cert-foot">
<span>📅 日期：<input class="cert-date" type="date" id="certDate"></span>
<span>🏆 拼读高手</span>
</div>
</div>
<div class="cert-actions">
<button class="btn btn-gold" onclick="downloadPDF()">⬇ 下载 PDF 证书</button>
<button class="btn btn-outline" onclick="window.print()">🖨️ 打印</button>
</div>
<p class="cert-note">填上名字和日期，点「下载 PDF 证书」一键保存到相册/文件</p>
</div></div>

<script src="data/83-graduation-know.js"></script>
<script src="data/83-graduation-book.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// === Stars ===
(function(){const c=document.getElementById('stars');for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;--dur:${2+Math.random()*4}s;--delay:${Math.random()*5}s;`;c.appendChild(s)}})();

// === Audio ===
var AUDIO_BASE='audio/';
var audioCache={};
function getAudio(path){var pl=audioCache[path];if(!pl){pl=new Audio(AUDIO_BASE+path);pl.preload='auto';audioCache[path]=pl;}return pl;}
function spk(word,el){
  var w=String(word).toLowerCase().replace(/[^a-z']/g,'');if(!w)return;
  var path='words/'+w+'.mp3';
  var on=el&&el.classList&&el.classList.contains('on');
  if(on)return;
  if(el&&el.classList)el.classList.add('on');
  var done=function(){if(el&&el.classList)el.classList.remove('on')};
  var p=getAudio(path);p.pause();p.currentTime=0;
  p.addEventListener('ended',done,{once:true});
  p.addEventListener('error',function(){done();speakNow(w)},{once:true});
  p.play().catch(function(){done()});
}
function speakNow(word){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=0.75;speechSynthesis.speak(u)}catch(e){}}

// === Navigation ===
function buildNav(){
  var h=KNOW.map(function(stage,i){return '<button class="nav-btn" style="--c:'+stage.c+'" onclick="showS(\'stage'+i+'\')">'+stage.name+'</button>'}).join('');
  h+='<button class="nav-btn" onclick="showS(\'book\')">📖 毕业绘本</button>';
  h+='<button class="nav-btn" onclick="showS(\'cert\')">🎓 毕业证书</button>';
  document.getElementById('nav').innerHTML=h;
}
function showS(n){
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')});
  document.getElementById('sec-'+n).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelectorAll('.nav-btn').forEach(function(b){if(b.getAttribute('onclick').indexOf("'"+n+"'")>=0)b.classList.add('active')});
}

// ===== 知识回顾渲染（每阶段一个 section）=====
function renderStage(i){
  var stage=KNOW[i];
  var h='<h2 style="color:'+stage.c+'">'+stage.name+'</h2><p class="khint">'+stage.intro+' · 每个例词点一下能听发音 🔊</p>';
  stage.subs.forEach(function(sub){
    h+='<div class="ksub" style="--c:'+stage.c+'"><div class="ksub-name">'+sub.name+'</div>';
    sub.cards.forEach(function(card){
      var ws=card.w.map(function(wp){return '<span class="kword" style="--c:'+stage.c+'" onclick="spk(\''+wp[0]+'\',this)">'+wp[0]+' <b>'+wp[1]+'</b> <span class="sp">🔊</span></span>'}).join('');
      h+='<div class="kcard"><div class="kcard-title"><span>'+card.i+'</span>'+card.t+'</div><div class="kcard-rule">'+card.r+'</div><div class="kcard-words">'+ws+'</div></div>';
    });
    h+='</div>';
  });
  document.getElementById('stageBox'+i).innerHTML=h;
}

// ===== 毕业绘本 =====
var bp_cp=0;
function renderText(x){
  return x.split(/(\s+)/).map(function(token){
    if(/^\s+$/.test(token))return token;
    var m=token.match(/^([^a-zA-Z']*)([a-zA-Z']+)(.*)$/);
    if(!m)return token;
    var w=m[2].toLowerCase();
    var card=WORDCARDS[w];
    if(card){return m[1]+'<span class="pw" data-w="'+w+'">'+m[2]+'</span>'+m[3];}
    return token;
  }).join('');
}
function renderPage(){
  var p=BOOK[bp_cp];
  document.getElementById('bookPage').innerHTML='<div class="book-page"><div class="book-scene">'+p.s+'</div><div class="book-title">'+p.t+'</div><div class="book-text">'+renderText(p.x)+'</div><div class="book-pron"><button class="pron-btn uk" onclick="spkBook(\'uk\')">🇬🇧 UK</button><button class="pron-btn us" onclick="spkBook(\'us\')">🇺🇸 US</button></div></div>';
  document.getElementById('bFill').style.width=((bp_cp+1)/BOOK.length*100)+'%';
  document.getElementById('bookNav').innerHTML='<button class="btn btn-outline" onclick="goPage(-1)"'+(bp_cp===0?' disabled':'')+'>⬅ 上一页</button><span class="book-pagenum">'+(bp_cp+1)+' / '+BOOK.length+'</span><button class="btn btn-gold" onclick="goPage(1)">'+(bp_cp>=BOOK.length-1?'🎓 看证书':'下一页 ▶')+'</button>';
  hideWpop();
}
function goPage(d){var n=bp_cp+d;if(n>=BOOK.length){showS('cert');return;}if(n<0)return;bp_cp=n;renderPage();}

var bp_audio=null;
function spkBook(accent){
  if(bp_audio){bp_audio.pause();bp_audio=null;document.querySelectorAll('.pron-btn.playing').forEach(function(b){b.classList.remove('playing')});return;}
  document.querySelectorAll('.pron-btn.playing').forEach(function(b){b.classList.remove('playing')});
  document.querySelectorAll('.pron-btn').forEach(function(b){if((accent==='uk'&&b.classList.contains('uk'))||(accent==='us'&&b.classList.contains('us')))b.classList.add('playing')});
  bp_audio=new Audio(AUDIO_BASE+'book/83-page'+(bp_cp+1)+'-'+accent+'.mp3');
  bp_audio.onended=function(){document.querySelectorAll('.pron-btn.playing').forEach(function(b){b.classList.remove('playing')});bp_audio=null};
  bp_audio.onerror=function(){document.querySelectorAll('.pron-btn.playing').forEach(function(b){b.classList.remove('playing')});bp_audio=null};
  bp_audio.play().catch(function(){document.querySelectorAll('.pron-btn.playing').forEach(function(b){b.classList.remove('playing')});bp_audio=null});
}

// ===== hover 词卡 =====
function showWpop(el){
  var w=el.getAttribute('data-w');var card=WORDCARDS[w];if(!card)return;
  var pop=document.getElementById('wpop');
  if(!pop){pop=document.createElement('div');pop.id='wpop';pop.className='wpop';document.body.appendChild(pop);}
  pop.innerHTML='<div class="wi">'+card.i+'</div><div class="ww">'+el.textContent+'</div><div class="wc">'+card.c+'</div>'+renderSeg(card.seg)+renderSyll(card.syll)+'<div class="wst">'+(card.st||'')+'</div><div class="wr">'+card.r+'</div>';
  pop.style.display='block';
  var r=el.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  var x=r.left+r.width/2-pw/2,y=r.top-ph-8;
  if(y<8)y=r.bottom+8;
  x=Math.max(8,Math.min(x,window.innerWidth-pw-8));
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function renderSyll(syll){
  if(!syll||!syll.length)return '';
  var h='<div class="wsyll">';
  syll.forEach(function(s,i){
    h+='<div class="wsyll-item"><div class="wsyll-syll">'+s[0]+'</div><div class="wsyll-ipa">'+s[1]+'</div><div class="wsyll-st">'+s[2]+'</div></div>';
    if(i<syll.length-1)h+='<div class="wsyll-sep">·</div>';
  });
  h+='</div>';
  return h;
}
function renderSeg(seg){
  if(!seg||!seg.length)return '';
  var h='<div class="wseg">';
  seg.forEach(function(s){
    var color=(s[2]==='v')?'#4fc3f7':((s[2]==='s'||s[2]==='e')?'#9e9e9e':'#81c784');
    var ipa=s[1]||(s[2]==='e'?'不发音':(s[2]==='s'?'静音':''));
    h+='<span class="wseg-item"><span class="wseg-let" style="color:'+color+'">'+s[0]+'</span><span class="wseg-ipa">'+ipa+'</span></span>';
  });
  h+='</div>';
  return h;
}
function hideWpop(){var p=document.getElementById('wpop');if(p)p.style.display='none';}
document.addEventListener('mouseover',function(e){var el=e.target.closest&&e.target.closest('.pw');if(el)showWpop(el)});
document.addEventListener('mouseout',function(e){var el=e.target.closest&&e.target.closest('.pw');if(el)hideWpop()});
document.addEventListener('touchstart',function(e){var el=e.target.closest&&e.target.closest('.pw');if(el){e.preventDefault();showWpop(el)}},{passive:false});
document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.pw'))hideWpop()});

// ===== 证书 PDF 下载 =====
function downloadPDF(){
  var btn=event.target;
  if(!window.html2canvas||!window.jspdf){alert('PDF 组件加载中，请稍候再试（需联网）');return;}
  var cert=document.getElementById('cert');
  html2canvas(cert,{scale:2,backgroundColor:'#ffffff',useCORS:true,onclone:function(doc){
    var nm=doc.getElementById('certName');
    if(nm){var s=doc.createElement('span');s.style.cssText='display:inline-block;border-bottom:2px dashed #b8860b;color:#b8860b;font-size:1.35em;font-weight:bold;padding:4px 16px;min-width:130px';s.textContent=nm.value||'________';nm.parentNode.replaceChild(s,nm);}
    var dt=doc.getElementById('certDate');
    if(dt){var d=doc.createElement('span');d.style.cssText='color:#b8860b;font-size:1em;font-weight:bold';var v=dt.value;d.textContent=v?(v.split('-')[0]+'年'+parseInt(v.split('-')[1])+'月'+parseInt(v.split('-')[2])+'日'):'____年__月__日';dt.parentNode.replaceChild(d,dt);}
  }}).then(function(canvas){
    var img=canvas.toDataURL('image/png');
    var pdf=new window.jspdf.jsPDF('p','mm','a4');
    var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    var ratio=canvas.width/canvas.height;
    var w=pw-20,h=w/ratio;
    if(h>ph-20){h=ph-20;w=h*ratio;}
    var x=(pw-w)/2,y=(ph-h)/2;
    pdf.addImage(img,'PNG',x,y,w,h);
    pdf.save('自然拼读毕业证书.pdf');
  }).catch(function(e){alert('生成失败，请重试')});
}
function setToday(){var d=new Date();var s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');var el=document.getElementById('certDate');if(el)el.value=s;}
