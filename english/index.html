<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语工具 · 可豆妈妈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
.container{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:20px 20px 60px}
.hero{text-align:center;padding:24px 0}
.hero h1{font-size:1.8em;background:linear-gradient(135deg,#42a5f5,#80deea);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#777;font-size:.9em;margin-top:8px}
.boards{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.board{display:flex;align-items:center;gap:14px;padding:20px 20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;text-decoration:none;color:#e0e0e0;transition:all .25s}
.board:hover{border-color:rgba(66,165,245,.45);background:rgba(66,165,245,.06);transform:translateY(-2px)}
.board-icon{font-size:2.2em;flex-shrink:0}
.board-info{flex:1;min-width:0}
.board-name{font-size:1.15em;font-weight:700;color:#42a5f5;margin-bottom:3px}
.board-desc{font-size:.82em;color:#888;line-height:1.4}
.board-arrow{color:#555;font-size:1.2em}
.footer{text-align:center;color:#444;font-size:.78em;margin-top:40px}
@media(max-width:500px){
  .hero h1{font-size:1.4em}.container{padding:16px 14px 50px}
  .board{padding:16px 14px}
  .board-icon{font-size:1.9em}
  .board-name{font-size:1.05em}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="hero"><h1>🔤 英语</h1><p>跟随公众号进度 · 工具持续更新中 🌱</p></div>

  <!-- ★ 添加新板块：复制一个 <a class="board"> 块，改图标/名称/描述/链接 ★ -->
  <div class="boards">
    <a class="board" href="phonics.html">
      <span class="board-icon">🔡</span>
      <span class="board-info">
        <span class="board-name">自然拼读</span>
        <span class="board-desc">从字母到自主阅读 · 6 阶体系配套互动工具（字母名音 · 元辅音 · CVC…）</span>
      </span>
      <span class="board-arrow">→</span>
    </a>
  </div>

  <div class="footer">关注公众号「可豆妈妈」获取最新英语工具</div>
</div>
<script>
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<40;i++){
    var s=document.createElement('div');s.className='star';
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*3+1)+'px;height:'+s.style.width+';--d:'+(Math.random()*3+2)+'s';
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
