<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可豆妈妈 · AI助学工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0c0d2e,#1a1a4e,#2d1b69);color:#fff;min-height:100vh}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.container{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:30px 20px}
.hero{text-align:center;padding:40px 0 20px}
.hero h1{font-size:2em;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.hero p{color:#aaa;font-size:.95em}
.cats{display:flex;flex-direction:column;gap:14px;margin:24px 0}
.cat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px 24px;text-decoration:none;color:#fff;transition:all .2s;display:flex;align-items:center;gap:14px}
.cat:hover{border-color:#ffd200;background:rgba(255,210,0,.06);transform:translateX(4px)}
.cat-icon{font-size:2em;flex-shrink:0}
.cat-info{flex:1}
.cat-title{font-size:1.2em;font-weight:bold;margin-bottom:4px}
.cat-desc{color:#999;font-size:.85em}
.cat-arrow{color:#ffd200;font-size:1.2em}
.footer{text-align:center;color:#666;font-size:.8em;margin-top:40px;padding-bottom:30px}
@media(max-width:500px){.hero h1{font-size:1.5em}.container{padding:20px 14px}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="hero">
    <h1>可豆妈妈 · AI助学工具</h1>
    <p>把抽象难点变直观 · 扫码就能玩</p>
  </div>
  <div class="cats">
    <a class="cat" href="math/">
      <span class="cat-icon">📐</span>
      <span class="cat-info">
        <div class="cat-title">数学</div>
        <div class="cat-desc">闰年、分数、几何 · 把课本上的「为什么」变成看得见</div>
      </span>
      <span class="cat-arrow">▸</span>
    </a>
    <a class="cat" href="english/">
      <span class="cat-icon">🔤</span>
      <span class="cat-info">
        <div class="cat-title">英语</div>
        <div class="cat-desc">自然拼读、Magic E · 互动闯关记规则</div>
      </span>
      <span class="cat-arrow">▸</span>
    </a>
    <a class="cat" href="general/">
      <span class="cat-icon">🌍</span>
      <span class="cat-info">
        <div class="cat-title">通识</div>
        <div class="cat-desc">太空冒险、百科探索 · 边玩边学</div>
      </span>
      <span class="cat-arrow">▸</span>
    </a>
  </div>
  <div class="footer">
    由 AI 辅助制作 · 持续更新中<br>关注公众号「可豆妈妈」获取最新工具
  </div>
</div>
<script>
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<60;i++){
    var s=document.createElement('div');s.className='star';
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*3+1)+'px;height:'+s.style.width+';--d:'+(Math.random()*3+2)+'s;animation-delay:'+Math.random()*3+'s';
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
