<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何 · 可豆妈妈数学工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
.container{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:20px 20px 60px}
.hero{text-align:center;padding:24px 0}
.hero h1{font-size:1.8em;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#777;font-size:.9em;margin-top:8px}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tool{display:flex;align-items:center;gap:12px;padding:16px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;text-decoration:none;color:#e0e0e0;transition:all .2s}
.tool:hover{border-color:rgba(247,151,30,.4);background:rgba(247,151,30,.05)}
.tool-icon{font-size:1.8em;flex-shrink:0}
.tool-info{flex:1;min-width:0}
.tool-name{font-size:1em;font-weight:600;color:#f7971e;margin-bottom:2px}
.tool-desc{font-size:.8em;color:#888;line-height:1.4}
.tool-arrow{color:#555;font-size:1.1em}
.footer{text-align:center;color:#444;font-size:.78em;margin-top:40px}
@media(max-width:500px){
  .hero h1{font-size:1.4em}.container{padding:16px 14px 50px}
  .tool{padding:14px}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="hero"><h1>📏 几何</h1><p>看清图形本身 · 工具持续更新中 🌱</p></div>

  <div class="tools">
    <a class="tool" href="geometry-map.html">
      <span class="tool-icon">🗺️</span>
      <span class="tool-info">
        <span class="tool-name">几何全景地图</span>
        <span class="tool-desc">帮小熊造小屋：选形状·量大小·怎么动·在哪里——四件事看懂整个几何</span>
      </span>
      <span class="tool-arrow">→</span>
    </a>
    <a class="tool" href="perimeter.html">
      <span class="tool-icon">📏</span>
      <span class="tool-info">
        <span class="tool-name">周长彻底搞懂</span>
        <span class="tool-desc">6步互动探索：描图形→选单位→推导公式→凹形拖拽→拼接靠墙→闯关测试</span>
      </span>
      <span class="tool-arrow">→</span>
    </a>
    <a class="tool" href="area.html">
      <span class="tool-icon">📐</span>
      <span class="tool-info">
        <span class="tool-name">面积探险</span>
        <span class="tool-desc">6步互动探索：生活场景→用小方块量→平方厘米→找规律→不规整形状→综合闯关</span>
      </span>
      <span class="tool-arrow">→</span>
    </a>
  </div>

  <div class="footer">关注公众号「可豆妈妈」获取最新数学工具</div>
</div>
<script>
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<40;i++){
    var s=document.createElement('div');s.className='star';
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*3+1)+'px;height:'+s.style.width+';--d:'+(Math.random()*3+2)+'s';
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
