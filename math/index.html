<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学工具 · 可豆妈妈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0c0d2e,#1a1a4e,#2d1b69);color:#fff;min-height:100vh}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.container{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:30px 20px}
.back{display:inline-block;color:#ffd200;text-decoration:none;font-size:.9em;margin-bottom:20px}
.hero{text-align:center;padding:20px 0}
.hero h1{font-size:1.8em;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.tools{display:flex;flex-direction:column;gap:12px;margin:20px 0}
.tool{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px 20px;text-decoration:none;color:#fff;transition:all .2s}
.tool:hover{border-color:#ffd200;background:rgba(255,210,0,.06)}
.tool-name{font-size:1.1em;font-weight:bold;color:#f7971e;margin-bottom:4px}
.tool-desc{color:#aaa;font-size:.85em;line-height:1.5}
.footer{text-align:center;color:#666;font-size:.8em;margin-top:40px}
@media(max-width:500px){.hero h1{font-size:1.4em}.container{padding:20px 14px}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <a class="back" href="../">◀ 返回首页</a>
  <div class="hero"><h1>📐 数学</h1></div>
  <div class="tools">
    <a class="tool" href="leapyear.html">
      <div class="tool-name">🌍 平年与闰年的秘密</div>
      <div class="tool-desc">双轨对比动画 + 日历管理员角色扮演。让孩子亲手推导「四年一闰、百年不闰、四百年再闰」</div>
    </a>
  </div>
  <div class="footer">更多工具开发中…</div>
</div>
<script>
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<50;i++){
    var s=document.createElement('div');s.className='star';
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*3+1)+'px;height:'+s.style.width+';--d:'+(Math.random()*3+2)+'s';
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
