<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>认识图形 · 几何探索 | 可豆妈妈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f7f4ed;color:#3a3530;font-size:16px;line-height:1.55}
.page{max-width:560px;margin:0 auto;padding:8px 14px 80px}
.hero{text-align:center;padding:26px 8px 16px}
.hero h1{font-size:1.32em;color:#d35400;margin-bottom:10px}
.hero .sub{font-size:.86em;color:#9b9183;line-height:1.6}
.step-tag{display:block;width:fit-content;margin:28px auto 6px;padding:3px 13px;border-radius:20px;font-size:.72em;color:#a9a094;background:#f0ebe0;font-weight:700}
h2{font-size:1.08em;color:#2980b9;text-align:center;margin:4px 0 8px}
.guide{text-align:center;font-size:.82em;color:#8a7e6e;margin-bottom:10px;line-height:1.55}

/* 立体图形卡片 */
.shape3d{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.s3dcard{cursor:pointer;text-align:center;padding:14px 10px;border-radius:16px;background:#fff;border:1.5px solid #e6dfd2;min-width:80px;transition:all .2s}
.s3dcard:active{transform:scale(.95)}
.s3dcard .s3emoji{font-size:2.6em;display:block}
.s3dcard .s3name{font-size:.76em;color:#8a7e6e;margin-top:4px;font-weight:600}
.s3dcard.show{border-color:#2980b9;box-shadow:0 0 0 3px rgba(41,128,185,.15)}
.flat-reveal{display:none;text-align:center;margin:6px 0;padding:12px;background:#f0f6fb;border-radius:12px;font-size:.86em;color:#4a443c;line-height:1.6;animation:pop .3s}
.flat-reveal.on{display:block}
.flat-reveal .femoji{font-size:2em;margin:0 3px}
.hint{text-align:center;font-size:.78em;color:#bcb4a8;margin-top:12px;font-style:italic}

/* 分一分 */
#sortCanvas{display:block;margin:0 auto;border-radius:14px;border:1px solid #e6dfd2;touch-action:none}
.bin-row{display:flex;gap:8px;justify-content:center;margin:10px 0}
.bin{flex:1;max-width:120px;min-height:70px;border:2px dashed #d8cfbe;border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:6px;font-size:.74em;color:#a9a094;font-weight:700;transition:all .2s}
.bin.drop{border-color:#2980b9;background:rgba(41,128,185,.04)}
.bin .placed{font-size:.76em;color:#5b5348;font-weight:600;margin:2px}

/* 角 */
.angle-wrap{text-align:center;margin:10px 0}
#angleCanvas{display:block;margin:0 auto;border-radius:14px;border:1px solid #e6dfd2;touch-action:none}
.angle-val{font-size:1.1em;font-weight:800;margin-top:6px;color:#d35400}
.angle-info{font-size:.82em;color:#8a7e6e;margin-top:2px;line-height:1.5}

/* 线 */
.lines{display:flex;gap:10px;justify-content:center;margin:10px 0}
.lcard{flex:1;max-width:130px;text-align:center;padding:14px 8px;background:#fff;border:1.5px solid #e6dfd2;border-radius:14px;cursor:pointer}
.lcard:active{transform:scale(.96)}
.lcard svg{display:block;margin:0 auto 6px}
.lcard .ln{font-weight:700;font-size:.86em;color:#5b5348}
.lcard .ld{font-size:.72em;color:#a9a094;margin-top:3px;line-height:1.4}
.lcard.sel{border-color:#d35400;box-shadow:0 0 0 2px rgba(212,83,0,.2)}

/* 闯关（独立数据，避免嵌套引用）*/
var quizData=[{q:'正方体的每个面是什么形状？',o:['三角形','正方形','圆'],a:1,x:'正方体的 6 个面都是正方形'},{q:'球从哪个方向看都是什么？',o:['正方形','三角形','圆'],a:2,x:'球从哪看都是圆'},{q:'圆柱有几个圆形的面？',o:['1个','2个','3个'],a:1,x:'圆柱上下两个面都是圆'},{q:'哪个角等于 90°？',o:['锐角','直角','钝角'],a:1,x:'直角方方正正 90°，像课桌角'},{q:'线段和直线的区别？',o:['线段有头有尾','线段更长','一样'],a:0,x:'线段有头有尾（能量长度）；直线没头没尾'},{q:'射线有几头有终点？',o:['两头都有','一头有','都没有'],a:1,x:'射线一头有起点，另一头无限射出去'},{q:'以下哪个是平面图形？',o:['正方体','球','三角形'],a:2,x:'三角形是扁扁的平面图形；正方体和球是立体的'},{q:'一个角张开 105° 叫什么？',o:['锐角','直角','钝角'],a:2,x:'大于 90° 的就是钝角！'}];
var quizQs=[],quizCur=0,quizAs=[];
function initQuiz(){
  var pool=quizData.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=pool[i];pool[i]=pool[j];pool[j]=t}
  quizQs=pool.slice(0,5);quizCur=0;quizAs=[void 0,void 0,void 0,void 0,void 0];renderQuiz()
}
function renderQuiz(){
  var q=quizQs[quizCur],c=quizAs[quizCur];
  var h='';for(var i=0;i<5;i++){var cls='qdot';if(i===quizCur)cls+=' cur';if(quizAs[i]!==undefined)cls+=(quizAs[i]===quizQs[i].a?' r':' w');h+='<div class="'+cls+'"></div>'}
  document.getElementById('qdots').innerHTML=h;
  h='<div class="qcard"><div class="qq">❓ '+(quizCur+1)+'/5. '+q.q+'</div><div class="qrow">';
  q.o.forEach(function(o,i){var cls='qbtn'+(c!==undefined?' lkd':'');if(c!==undefined){if(i===q.a)cls+=' r';else if(i===c)cls+=' w'}h+='<button class="'+cls+'" onclick="ansQuiz('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>'});
  h+='</div><div class="qexp">'+(c!==undefined?((c===q.a?'<span style="color:#27ae60">✅ 对！</span> ':'<span style="color:#e67e22">❌ 不对～</span> ')+'<span style="color:#8a7e6e">💡 '+q.x+'</span>'):'')+'</div></div>';
  document.getElementById('qbody').innerHTML=h;
  if(quizAs.every(function(x){return x!==undefined}))document.getElementById('qbody').insertAdjacentHTML('beforeend','<div style="text-align:center;margin-top:8px"><button class="qbtn" onclick="showFinal()">查看成绩</button></div>')
}
function ansQuiz(i){if(quizAs[quizCur]!==undefined)return;quizAs[quizCur]=i;if(quizQs[quizCur].a===i)sfxOK();else sfxNO();renderQuiz()}
function showFinal(){
  var s=0;quizAs.forEach(function(a,i){if(a===quizQs[i].a)s++});
  var f=document.getElementById('qfinal');f.className='qfinal show';
  f.innerHTML='<div style="font-size:2.2em">'+(s>=5?'🎉🌟':s>=3?'👍😊':'📖✨')+'</div><div style="font-size:1.3em;color:#d35400;margin:6px 0">'+s+'/5</div><p style="color:#8a7e6e;font-size:.88em">'+(s>=5?'你是图形侦探王！':s>=3?'很不错！':'再来一次～')+'</p><button class="qbtn" onclick="initQuiz();document.getElementById(\'qfinal\').className=\'qfinal\'">🔄 再来一次</button>'
}
initQuiz();</script></body></html>
