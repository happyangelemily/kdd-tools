<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>几何 · 帮小熊造小屋 | 可豆妈妈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f7f4ed;color:#3a3530;font-size:16px;line-height:1.55}
.page{max-width:560px;margin:0 auto;padding:8px 14px 80px}
.hero{text-align:center;padding:24px 8px 14px}
.hero h1{font-size:1.32em;color:#d35400;margin-bottom:14px;line-height:1.4}
.ws{font-size:.86em;color:#9b9183;line-height:1.65;padding:0 4px}
.ws b{color:#775540;font-weight:600}
.tiphint{text-align:center;font-size:.82em;color:#c99a5a;margin:10px 0 6px;font-weight:600}

/* 场景 */
.scene-box{position:relative;margin:6px 0 8px;border-radius:20px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.scene-box svg{display:block;width:100%;height:auto}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:3}
.hs .dot{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:1.25em;box-shadow:0 2px 10px rgba(0,0,0,.18);animation:pp 2s ease-in-out infinite}
.hs:nth-child(2) .dot{animation-delay:.5s}.hs:nth-child(3) .dot{animation-delay:1s}.hs:nth-child(4) .dot{animation-delay:1.5s}
@keyframes pp{0%,100%{transform:scale(1);box-shadow:0 2px 10px rgba(0,0,0,.18)}50%{transform:scale(1.12);box-shadow:0 3px 18px rgba(212,83,0,.4)}}
.hs .lb{margin-top:3px;font-size:.62em;font-weight:700;color:#fff;background:rgba(60,50,40,.72);padding:2px 7px;border-radius:8px;white-space:nowrap}
.hs.done .dot{background:#e6f6ec;border-color:#27ae60}
.hs.done .lb{background:#27ae60}

/* 玩法区 */
.play{background:#fff;border:1px solid #efe4d4;border-radius:16px;padding:16px;margin-top:8px;min-height:60px;display:none}
.play.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.play .pq{font-size:1.02em;font-weight:700;margin-bottom:4px}
.play .pw{font-size:.82em;color:#9b9183;margin-bottom:12px;line-height:1.5}
.play .pfb{margin-top:12px;font-size:.9em;font-weight:700;min-height:22px;line-height:1.5}
.ok{color:#27ae60}.no{color:#e67e22}

/* 形状选择 */
.shape-opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.shape-opt{width:74px;height:74px;border:2px solid #e6dfd2;border-radius:14px;background:#fcf9f4;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.shape-opt:active{transform:scale(.94)}
.shape-opt.good{border-color:#27ae60;background:#e6f6ec}
.shape-opt.bad{border-color:#e67e22;background:#fdeee0;animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shape-opt svg{width:46px;height:46px}

/* 铺格子 */
.fillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:230px;margin:0 auto}
.cell{aspect-ratio:1;border:1.5px dashed #d8cfbe;border-radius:6px;background:#fcf9f4;cursor:pointer;transition:all .12s}
.cell.f{background:#f2b76a;border-style:solid;border-color:#e6913a}
.cellcount{text-align:center;font-size:.9em;color:#8a7e6e;margin-top:10px;font-weight:600}

/* 开门 */
.doorbtn{display:block;margin:4px auto 0;padding:11px 26px;border:none;border-radius:24px;background:linear-gradient(135deg,#3fb86a,#27ae60);color:#fff;font-size:1em;font-weight:700;cursor:pointer;font-family:inherit}
.doorbtn:active{transform:scale(.96)}

/* 放书格 */
.shelfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:200px;margin:0 auto;background:#c9a878;padding:8px;border-radius:8px}
.scell{aspect-ratio:1.1;background:#f5ecd7;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.4em;transition:all .12s}
.scell:active{transform:scale(.93)}
.scell.good{background:#e6f6ec}
.scell.bad{background:#fdeee0;animation:sh .4s}
.rowlab{text-align:center;font-size:.75em;color:#a99;margin-bottom:6px}

.section-hd{text-align:center;margin:34px 0 12px}
.section-hd h2{font-size:1.08em;color:#5b5348}
.section-hd .hd-sub{font-size:.76em;color:#bcb4a8;margin-top:4px}

/* 展开卡片 */
.asp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.asp-card{background:#fff;border:1.5px solid #ece3d5;border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}
.asp-top{display:flex;align-items:center;gap:8px;padding:13px 12px}
.asp-em{font-size:1.5em}.asp-name{font-size:.9em;font-weight:700;color:#5b5348;flex:1}
.asp-arrow{font-size:.72em;color:#c3bbac;transition:transform .25s}
.asp-card.open .asp-arrow{transform:rotate(180deg)}
.asp-body{display:none;padding:0 13px 13px}
.asp-card.open .asp-body{display:block}
.asp-link,.asp-soon{display:inline-block;margin:5px 4px 0 0;padding:5px 12px;border-radius:15px;font-size:.78em;font-weight:600}
.asp-link{text-decoration:none;background:#fdf6ed;color:#d35400;border:1px solid #f0cca8}
.asp-soon{color:#bcb4a8;background:#f9f6f1;border:1px dashed #ddd8cc}
.c-know{color:#2980b9}.c-measure{color:#e67e22}.c-move{color:#27ae60}.c-where{color:#8e44ad}

/* 路线图 */
.road{position:relative;margin:6px 0;padding:26px 6px 8px}
.road-line{position:absolute;top:46px;left:9%;right:9%;height:3px;background:linear-gradient(to right,#2980b9,#27ae60,#e67e22,#8e44ad);border-radius:2px;opacity:.3}
.road-stops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.road-stop{text-align:center;min-width:58px;z-index:1}
.rs-dot{width:14px;height:14px;border-radius:50%;margin:0 auto 6px;border:2px solid #ccc;background:#fff}
.rs-stage{font-size:.63em;color:#bcb4a8;margin-bottom:1px}
.rs-name{font-size:.76em;font-weight:700;color:#5b5348}
.road-stop.here .rs-dot{width:17px;height:17px;border-color:#d35400;background:#fff3e0;box-shadow:0 0 9px rgba(212,83,0,.4)}
.road-stop.here .rs-name{color:#d35400}
.road-stop.here .rs-flag{font-size:.6em;color:#d35400;font-weight:700;margin-top:2px}
.road-stop.future .rs-dot{border-style:dashed;background:transparent}
.road-stop.future .rs-name{color:#c3bbac;font-weight:400}

.foot{text-align:center;color:#c3bbac;font-size:.78em;margin:28px 0 10px;line-height:1.7}
@media(max-width:420px){.hero h1{font-size:1.16em}.asp{grid-template-columns:1fr}.hs .dot{width:34px;height:34px;font-size:1.05em}}

.sortwrap{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:14px;min-height:40px}
.chip{padding:9px 15px;border-radius:18px;background:#fff;border:1.5px solid #d8cfbe;font-size:.88em;font-weight:600;color:#5b5348;cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.94)}
.chip.sel{border-color:#d35400;background:#fff3e6;box-shadow:0 0 10px rgba(212,83,0,.3)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bin{border-radius:14px;padding:11px 10px;min-height:82px;border:2px dashed #ddd4c4;cursor:pointer;transition:all .15s;background:#fcfaf6}
.bin.know{border-color:#a9cce3}.bin.measure{border-color:#f0c090}.bin.move{border-color:#a6dcb8}.bin.where{border-color:#cdb0dd}
.bin.wrong{animation:sh .4s;border-color:#e67e22}
.bin-hd{font-size:.84em;font-weight:700;margin-bottom:7px}
.bin.know .bin-hd{color:#2980b9}.bin.measure .bin-hd{color:#e67e22}.bin.move .bin-hd{color:#27ae60}.bin.where .bin-hd{color:#8e44ad}
.bin-items{display:flex;flex-wrap:wrap;gap:5px}
.placed{padding:4px 11px;border-radius:12px;font-size:.78em;font-weight:600;background:#fff;border:1px solid #e6dfd2;color:#5b5348}
.placed a{text-decoration:none;color:#d35400}
.sortfb{text-align:center;font-size:.9em;font-weight:700;min-height:24px;margin-top:12px;line-height:1.5}
.journey{position:relative;margin:4px 0}
.jstart{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fff3e0,#fff8f0);border:1.5px solid #f0d0a8;border-radius:14px;padding:12px 14px;margin-bottom:2px}
.jstart .je{font-size:1.9em}.jstart .jt{font-weight:800;color:#d35400;font-size:.98em}.jstart .js{font-size:.76em;color:#a98b6a}
.jitem{position:relative;padding:9px 0 9px 30px;margin-left:20px;border-left:2px solid #e5ddcd}
.jitem .jdot{position:absolute;left:-9px;top:12px;width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid #ccc}
.jitem .jname{font-weight:700;font-size:.9em;color:#5b5348}
.jitem .jtag{display:inline-block;font-size:.64em;color:#fff;padding:1px 8px;border-radius:8px;margin-left:7px;vertical-align:middle}
.jd-know{background:#2980b9}.jd-measure{background:#e67e22}.jd-move{background:#27ae60}.jd-where{background:#8e44ad}
.jt-know{background:#2980b9}.jt-measure{background:#e67e22}.jt-move{background:#27ae60}.jt-where{background:#8e44ad}
.jvista-hd{margin:14px 0 8px 20px;font-size:.8em;color:#b7ae9e;font-weight:600}
.jvista{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;margin:0 0 8px 20px;background:#f6f2ea;border:1.5px dashed #ddd4c4;border-radius:12px;opacity:.9}
.jvista .ve{font-size:1.7em}.jvista .vt{font-weight:700;font-size:.86em;color:#9b8f7c}.jvista .vs{font-size:.74em;color:#b7ae9e;line-height:1.5}

.fam{display:flex;flex-direction:column;gap:8px}
.famcard{border-radius:14px;border:1.5px solid #e6dfd2;overflow:hidden;background:#fff;transition:all .2s}
.famcard.know{border-color:#a9cce3}.famcard.measure{border-color:#f0c090}.famcard.move{border-color:#a6dcb8}.famcard.where{border-color:#cdb0dd}
.fhd{display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer;font-weight:700;font-size:.94em}
.famcard.know .fhd{color:#2980b9}.famcard.measure .fhd{color:#e67e22}.famcard.move .fhd{color:#27ae60}.famcard.where .fhd{color:#8e44ad}
.fhd .fem{font-size:1.35em}
.fhd .fcue{margin-left:auto;font-size:.72em;color:#bcb4a8;font-weight:400}
.fhd .farr{font-size:.7em;color:#c3bbac;transition:transform .25s;margin-left:6px}
.famcard.open .farr{transform:rotate(180deg)}
.fbody{display:none;flex-wrap:wrap;gap:7px;padding:0 14px 14px}
.famcard.open .fbody{display:flex}
.fmem{padding:7px 13px;border-radius:15px;background:#faf7f1;border:1px solid #e6dfd2;font-size:.84em;font-weight:600;color:#5b5348;animation:pop .35s both}
.famcard.know .fmem{border-left:3px solid #2980b9}.famcard.measure .fmem{border-left:3px solid #e67e22}.famcard.move .fmem{border-left:3px solid #27ae60}.famcard.where .fmem{border-left:3px solid #8e44ad}
</style></head><body>
<div class="page">

  <div class="hero">
    <h1>🏠 帮小熊造一间梦想小屋</h1>
    <div class="ws">造小屋要<b>选形状</b>、<b>量大小</b>、让门<b>转开</b>、把东西<b>摆对位置</b>——<br>这四件事，就是整个几何！</div>
  </div>
  <div class="tiphint">👇 点小屋上发光的圆点，动手帮小熊造～</div>

  <div class="scene-box" id="sceneBox">
    <svg viewBox="0 0 560 400" id="scene">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8fb"/><stop offset="1" stop-color="#eef7fd"/></linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe08c"/><stop offset="1" stop-color="#a9d472"/></linearGradient>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeacb"/><stop offset="1" stop-color="#f3d8a5"/></linearGradient>
        <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8845f"/><stop offset="1" stop-color="#c85a3a"/></linearGradient>
        <linearGradient id="door" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b5794a"/><stop offset="1" stop-color="#9c6238"/></linearGradient>
        <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffd45e"/></radialGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/></filter>
      </defs>

      <rect x="0" y="0" width="560" height="400" fill="url(#sky)"/>
      <circle cx="490" cy="66" r="34" fill="url(#sun)"/>
      <rect x="0" y="300" width="560" height="100" fill="url(#grass)"/>
      <!-- 云 -->
      <g fill="#ffffff" opacity=".85"><ellipse cx="110" cy="70" rx="34" ry="18"/><ellipse cx="140" cy="66" rx="26" ry="16"/><ellipse cx="80" cy="66" rx="22" ry="14"/></g>
      <!-- 树 -->
      <rect x="42" y="228" width="14" height="82" rx="5" fill="#a9784e"/>
      <circle cx="49" cy="212" r="34" fill="#8ec26a"/><circle cx="30" cy="228" r="22" fill="#9fce7a"/><circle cx="68" cy="228" r="22" fill="#9fce7a"/>

      <!-- 房子 -->
      <g filter="url(#sh)">
        <rect x="150" y="150" width="252" height="160" rx="6" fill="url(#wall)"/>
      </g>
      <!-- 屋顶 (可高亮) -->
      <polygon id="roofShape" points="132,154 276,52 420,154" fill="url(#roof)" stroke="#a6522f" stroke-width="2"/>
      <!-- 烟囱 -->
      <rect x="346" y="30" width="28" height="56" rx="3" fill="#c96a48"/><rect x="342" y="26" width="36" height="12" rx="3" fill="#b05a3a"/>
      <!-- 窗 -->
      <rect x="292" y="182" width="46" height="46" rx="4" fill="#dff0fb" stroke="#c9a878" stroke-width="3"/>
      <line x1="315" y1="182" x2="315" y2="228" stroke="#c9a878" stroke-width="2.5"/>
      <line x1="292" y1="205" x2="338" y2="205" stroke="#c9a878" stroke-width="2.5"/>
      <polygon points="294,184 336,184 294,226" fill="#ffffff" opacity=".35"/>

      <!-- 门洞(深色) -->
      <rect x="188" y="222" width="64" height="88" rx="4" fill="#5a3d28"/>
      <!-- 门 (可转开) -->
      <g id="doorG" style="transform-box:fill-box;transform-origin:0% 50%;transition:transform .7s ease">
        <rect x="188" y="222" width="64" height="88" rx="4" fill="url(#door)" stroke="#7d5030" stroke-width="2"/>
        <rect x="196" y="232" width="48" height="30" rx="3" fill="none" stroke="#8a5c38" stroke-width="2"/>
        <rect x="196" y="268" width="48" height="34" rx="3" fill="none" stroke="#8a5c38" stroke-width="2"/>
        <circle cx="240" cy="270" r="4" fill="#ffd45e"/>
      </g>

      <!-- 书架 -->
      <g id="shelfG">
        <rect x="352" y="196" width="42" height="110" rx="3" fill="#c9a878" stroke="#a07850" stroke-width="2"/>
        <line x1="352" y1="232" x2="394" y2="232" stroke="#a07850" stroke-width="2"/>
        <line x1="352" y1="269" x2="394" y2="269" stroke="#a07850" stroke-width="2"/>
      </g>

      <!-- 地毯 -->
      <g id="rugG"><rect x="70" y="286" width="200" height="26" rx="8" fill="#efd9b3" stroke="#d8bd8e" stroke-width="1.5" stroke-dasharray="3 4"/>
      <g fill="#d8bd8e"><rect x="96" y="291" width="9" height="16"/><rect x="124" y="291" width="9" height="16"/><rect x="152" y="291" width="9" height="16"/><rect x="180" y="291" width="9" height="16"/><rect x="208" y="291" width="9" height="16"/><rect x="236" y="291" width="9" height="16"/></g></g>

      <!-- 小熊 -->
      <g>
        <ellipse cx="96" cy="315" rx="17" ry="15" fill="#c69a6c"/>
        <rect x="84" y="300" width="24" height="26" rx="10" fill="#c69a6c"/>
        <circle cx="96" cy="286" r="19" fill="#cfa274"/>
        <circle cx="83" cy="274" r="8" fill="#cfa274"/><circle cx="109" cy="274" r="8" fill="#cfa274"/>
        <circle cx="83" cy="274" r="4" fill="#b0855e"/><circle cx="109" cy="274" r="4" fill="#b0855e"/>
        <ellipse cx="96" cy="292" rx="9" ry="7" fill="#eaddc8"/>
        <circle cx="90" cy="284" r="2.6" fill="#3a2c1e"/><circle cx="102" cy="284" r="2.6" fill="#3a2c1e"/>
        <circle cx="96" cy="290" r="2.4" fill="#3a2c1e"/>
        <path d="M92 294 Q96 298 100 294" stroke="#3a2c1e" stroke-width="1.4" fill="none"/>
      </g>
    </svg>

    <div class="hs" data-a="shape" style="left:49%;top:22%"><div class="dot">🔺</div><div class="lb">长什么样</div></div>
    <div class="hs" data-a="size" style="left:30%;top:76%"><div class="dot">📏</div><div class="lb">有多大</div></div>
    <div class="hs" data-a="move" style="left:39%;top:66%"><div class="dot">🔄</div><div class="lb">怎么动</div></div>

  <div class="play" id="play"></div>

  <div class="section-hd"><h2>📂 每一类，还有哪些成员？</h2><div class="hd-sub">造小屋只是举了个例子～点开每一类，看看它的大家庭（🏠=小屋里玩过的）</div></div>
  <div class="fam" id="fam"></div>

  <div class="section-hd"><h2>🎮 考考你：给知识找个「家」</h2><div class="hd-sub">认识了这么多成员，把下面的知识送回它属于的那件事～</div></div>
  <div class="sortwrap"><div class="chips" id="chips"></div><div class="bins" id="bins"></div><div class="sortfb" id="sortfb"></div></div>

  <div class="section-hd"><h2>🗺️ 几何这条路，你才刚起步</h2><div class="hd-sub">造小屋学的 4 件事，会一路陪你到高中～</div></div>
  <div class="journey" id="journey"></div>

  <div class="foot">小熊的小屋造好啦，几何地图也拿到手 ✨<br>以后学到任何几何，想想它是小屋的哪个零件～<br><br>可豆妈妈 · 更多几何互动工具陆续上线 🌱</div>
</div>

<script>
function beep(f,d,t){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function sfxOK(){beep(660,.1);setTimeout(function(){beep(880,.14)},90)}
function sfxNO(){beep(200,.18,'triangle')}
function sfxTap(){beep(560,.09)}

var done={};
function markDone(a){done[a]=1;var el=document.querySelector('.hs[data-a="'+a+'"]');if(el)el.classList.add('done')}

document.querySelectorAll('.hs').forEach(function(el){
  el.onclick=function(){openPlay(el.getAttribute('data-a'))};
});

function openPlay(a){
  sfxTap();
  var p=document.getElementById('play');p.className='play show';
  if(a==='shape')p.innerHTML=shapeHTML();
  else if(a==='size')p.innerHTML=sizeHTML();
  else if(a==='move'){p.innerHTML=moveHTML();}
  else if(a==='where')p.innerHTML=whereHTML();
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* 1 形状 */
function shapeHTML(){
  return '<div class="pq" style="color:#2980b9">🔺 它长什么样？——认形状</div>'
  +'<div class="pw">小熊的屋顶该用哪个形状？点一个试试～</div>'
  +'<div class="shape-opts">'
  +'<div class="shape-opt" onclick="pickShape(this,1)"><svg viewBox="0 0 46 46"><polygon points="23,4 44,42 2,42" fill="#e8845f"/></svg></div>'
  +'<div class="shape-opt" onclick="pickShape(this,0)"><svg viewBox="0 0 46 46"><rect x="6" y="6" width="34" height="34" rx="3" fill="#6ba9d8"/></svg></div>'
  +'<div class="shape-opt" onclick="pickShape(this,0)"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="#9fce7a"/></svg></div>'
  +'</div><div class="pfb" id="pfb"></div>';
}
function pickShape(el,ok){
  if(ok){el.classList.add('good');sfxOK();
    document.getElementById('roofShape').setAttribute('stroke','#ffd45e');
    document.getElementById('roofShape').setAttribute('stroke-width','5');
    document.getElementById('pfb').innerHTML='<span class="ok">✅ 对！屋顶是三角形。</span><br><span style="font-weight:400;color:#8a7e6e">认得出形状，才挑得对零件——这就是几何的第一件事：<b style="color:#2980b9">认形状</b>。</span>';
    markDone('shape');
  }else{el.classList.add('bad');sfxNO();setTimeout(function(){el.classList.remove('bad')},450);
    document.getElementById('pfb').innerHTML='<span class="no">再想想～屋顶是尖尖的哦。</span>';}
}

/* 2 铺地毯(面积) */
function sizeHTML(){
  var g='';for(var i=0;i<12;i++)g+='<div class="cell" onclick="fillCell(this)"></div>';
  return '<div class="pq" style="color:#e67e22">📏 它有多大？——量大小</div>'
  +'<div class="pw">帮小熊把地毯铺满地板！点一点每个格子～</div>'
  +'<div class="fillgrid">'+g+'</div>'
  +'<div class="cellcount" id="cc">已铺 0 / 12 块</div><div class="pfb" id="pfb2"></div>';
}
var filled=0;
function fillCell(el){
  if(el.classList.contains('f'))return;
  el.classList.add('f');filled++;sfxTap();
  document.getElementById('cc').textContent='已铺 '+filled+' / 12 块';
  if(filled>=12){sfxOK();
    document.getElementById('pfb2').innerHTML='<span class="ok">✅ 铺满啦！</span><br><span style="font-weight:400;color:#8a7e6e">铺满用了 12 块 = <b style="color:#e67e22">面积</b>；绕地毯一圈的长 = <b style="color:#e67e22">周长</b>。量大小，就是几何的第二件事。</span>';
    markDone('size');filled=0;}
}

/* 3 开门(旋转) */
var doorOpen=false;
function moveHTML(){
  return '<div class="pq" style="color:#27ae60">🔄 它怎么动？——玩变形</div>'
  +'<div class="pw">小熊要进屋，帮它把门推开～</div>'
  +'<button class="doorbtn" onclick="swingDoor()" id="db">👉 推开门</button>'
  +'<div class="pfb" id="pfb3"></div>';
}
function swingDoor(){
  doorOpen=!doorOpen;
  var g=document.getElementById('doorG');
  g.style.transform=doorOpen?'scaleX(0.16)':'scaleX(1)';
  document.getElementById('db').textContent=doorOpen?'👈 关上门':'👉 推开门';
  sfxTap();
  if(doorOpen){sfxOK();
    document.getElementById('pfb3').innerHTML='<span class="ok">✅ 门转开啦，小熊进屋咯！</span><br><span style="font-weight:400;color:#8a7e6e">门绕着门轴<b style="color:#27ae60">转</b>——这就是几何的第三件事：<b style="color:#27ae60">图形怎么动</b>（平移、旋转、对称）。</span>';
    markDone('move');}
}

/* 4 放书(位置) */
function whereHTML(){
  var g='';for(var r=1;r<=3;r++)for(var col=1;col<=3;col++)g+='<div class="scell" data-r="'+r+'" data-c="'+col+'" onclick="placeBook(this)"></div>';
  return '<div class="pq" style="color:#8e44ad">🧭 它在哪里？——找位置</div>'
  +'<div class="pw">把小熊的书 📕 放到 <b>第 2 排、从左数第 3 个</b> 格子～</div>'
  +'<div class="rowlab">↓ 从上往下数排，从左往右数个 ↓</div>'
  +'<div class="shelfgrid">'+g+'</div><div class="pfb" id="pfb4"></div>';
}
function placeBook(el){
  var r=el.getAttribute('data-r'),col=el.getAttribute('data-c');
  if(r==='2'&&col==='3'){el.classList.add('good');el.textContent='📕';sfxOK();
    document.getElementById('pfb4').innerHTML='<span class="ok">✅ 找对啦！第 2 排第 3 个。</span><br><span style="font-weight:400;color:#8a7e6e">说清"第几排第几个"，就是几何的第四件事：<b style="color:#8e44ad">图形在哪里</b>（方向、数对）。</span>';
    markDone('where');
  }else{el.classList.add('bad');sfxNO();setTimeout(function(){el.classList.remove('bad')},450);
    document.getElementById('pfb4').innerHTML='<span class="no">不对哦～第 2 排（上往下第2行），从左数第 3 个。</span>';}
}

/* 展开卡片 */
/* 每一类大家庭 */
var FAM=[
 {a:'know',icon:'👀',name:'长什么样',mem:[['三角形',1],['长方形',0],['圆',0],['角',0],['长方体·圆柱',0]]},
 {a:'measure',icon:'📏',name:'有多大',mem:[['长度',0],['周长',1],['面积',1],['体积',0],['角度',0]]},
 {a:'move',icon:'🔄',name:'怎么动',mem:[['平移',0],['旋转',1],['轴对称',0],['放大缩小',0]]},
 {a:'where',icon:'🧭',name:'在哪里',mem:[['方向',0],['数对',1],['路线图',0]]}
];
(function(){
  var h='';FAM.forEach(function(f){
    h+='<div class="famcard '+f.a+'" id="fam-'+f.a+'"><div class="fhd" onclick="toggleFam(\''+f.a+'\')"><span class="fem">'+f.icon+'</span><span>'+f.name+'</span><span class="fcue">点开看大家庭</span><span class="farr">▼</span></div><div class="fbody">';
    f.mem.forEach(function(m,i){h+='<span class="fmem" style="animation-delay:'+(i*0.05)+'s">'+m[0]+(m[1]?' 🏠':'')+'</span>'});
    h+='</div></div>';
  });
  document.getElementById('fam').innerHTML=h;
})();
function toggleFam(a){var el=document.getElementById('fam-'+a);el.classList.toggle('open');sfxTap();}

/* 分类小游戏 */
var BINS=[{a:'know',icon:'👀',name:'长什么样'},{a:'measure',icon:'📏',name:'有多大'},{a:'move',icon:'🔄',name:'怎么动'},{a:'where',icon:'🧭',name:'在哪里'}];
var CHIPS=[{t:'长方形',a:'know'},{t:'三角形',a:'know'},{t:'周长',a:'measure',l:'perimeter.html'},{t:'面积',a:'measure',l:'area.html'},{t:'对称',a:'move'},{t:'旋转',a:'move'},{t:'方向',a:'where'},{t:'数对',a:'where'}];
function shuf(x){for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t}return x}
var order=shuf(CHIPS.map(function(_,i){return i}));
var placedIn={},selIdx=-1;
function renderSort(){
  var ch='';order.forEach(function(i){if(placedIn[i]===undefined){ch+='<div class="chip'+(selIdx===i?' sel':'')+'" onclick="selChip('+i+')">'+CHIPS[i].t+'</div>'}});
  if(ch==='')ch='<div style="color:#27ae60;font-weight:700;font-size:.9em">全部分好啦 🎉</div>';
  document.getElementById('chips').innerHTML=ch;
  var bh='';BINS.forEach(function(b){
    var items='';CHIPS.forEach(function(c,i){if(placedIn[i]===b.a){items+='<span class="placed">'+(c.l?'<a href="'+c.l+'">'+c.t+' 🔗</a>':c.t)+'</span>'}});
    bh+='<div class="bin '+b.a+'" id="bin-'+b.a+'" onclick="dropBin(\''+b.a+'\')"><div class="bin-hd">'+b.icon+' '+b.name+'</div><div class="bin-items">'+items+'</div></div>';
  });
  document.getElementById('bins').innerHTML=bh;
}
function selChip(i){selIdx=(selIdx===i?-1:i);sfxTap();renderSort()}
function dropBin(a){
  var fb=document.getElementById('sortfb');
  if(selIdx<0){fb.innerHTML='<span class="no">👆 先点一个上面的知识词</span>';return}
  if(CHIPS[selIdx].a===a){placedIn[selIdx]=a;selIdx=-1;sfxOK();renderSort();
    var left=order.filter(function(i){return placedIn[i]===undefined}).length;
    if(left===0)fb.innerHTML='<span class="ok">🎉 太棒了！你已经会给几何知识「定位」了——<br>以后学到任何新知识，都能想想它属于哪件事。</span>';
    else fb.innerHTML='<span class="ok">✅ 对！</span>';
  }else{var el=document.getElementById('bin-'+a);el.classList.add('wrong');setTimeout(function(){el.classList.remove('wrong')},420);sfxNO();
    fb.innerHTML='<span class="no">再想想～这个知识是在问「哪件事」？</span>';}
}
renderSort();
